  const from = S.account.openFrom || S.account.checkedOn || today;
  const late = scheduleIn(from < today ? from : today, addDays(today, -1)).filter((o) => o.kind !== "income" && !o.done);
  openModal({
    title: S.account.checkedOn ? "Start from today" : "Your balance",
    body: `<p class="muted">Look at your banking app and enter what's in your spending account right now. ${S.account.checkedOn ? "You don't need to add the days you missed." : ""}</p>
      <div class="money-input mt">${moneyInp("balance", S.account.checkedOn ? balanceNow() : "", 'autofocus aria-label="Balance right now" min="-10000000"')}</div>
      ${late.length ? `<h3 class="mt-l">Bills from while you were away</h3><p class="tiny">Already taken out of your account? Mark them paid — they won't be taken off again.</p>
        <div class="list mt-s">${late.map((o, i) => `<div class="li"><div class="when">${fmtDay(o.date)}</div><div class="name">${esc(o.name)}</div><div class="amt m">${money(o.amount)}</div>
          ${sel(`late${i}`, [["paid", "Paid already"], ["due", "Still due"], ["skip", "Skipped"]], "paid")}</div>`).join("")}</div>` : ""}`,
    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Start from today</button>`,
    onSubmit: (d) => {
      if (String(d.balance).trim() === "") { toast("Enter your balance"); return false; }
      const undo = snapshot();
      let openFrom = today;
      late.forEach((o, i) => {
        const choice = d[`late${i}`];
        if (choice === "paid") toggleOccurrence(o); // dated before today → recorded as already in the balance
        else if (choice === "skip") S.links[o.key] = "skip";
        else if (o.date < openFrom) openFrom = o.date;
      });
      checkBalance(num(d.balance), openFrom);
      // Paid-while-away items are already in the balance just entered.
      for (const t of S.transactions) if (late.some((o) => o.key === t.link)) t.absorbed = true;
      commit("Fresh start — your number is up to date", undo);
    },
  });
}
function openAfford() {
  const form = openModal({
    title: "Can I afford it?",
    body: `<p class="muted">Type a price. Nothing is recorded until you choose.</p><div class="money-input mt">${moneyInp("amount", "", 'autofocus aria-label="Price"')}</div><div class="afford-out mt" aria-live="polite"></div>`,
    foot: `<button type="button" class="btn left" data-pause>${icon("pause")}Pause it</button><button type="button" class="btn" data-close>Close</button><button class="btn primary">Add this expense</button>`,
    onSubmit: (d) => { const amount = num(d.amount); if (!(amount > 0)) { toast("Enter a price first"); return false; } setTimeout(() => openTxForm(null, { amount }), 10); },
  });
  const out = $(".afford-out", form);
  const show = () => {

      ? `<div class="nudge ${p.fitsToday ? "good-nudge" : ""}"><span class="e">${p.fitsToday ? "🌿" : "🤔"}</span><div><b>${p.fitsToday ? `Yes — ${money(p.leftToday - amount)} left today.` : "It fits, but it's more than today's guide."}</b><div class="tiny">After this: ${money(p.after)} until ${fmtDay(p.h)} · about ${money(p.perDay)} a day.</div></div></div>`
      : `<div class="nudge warn-nudge"><span class="e">✋</span><div><b>Not before payday.</b><div class="tiny">It would leave your bills ${money(p.short)} short. Pausing it is a kind choice.</div></div></div>`;

/* 09-nook.js */
/* ==========================================================================
   The Honey Nook: an illustrated cozy room with a companion who reacts to
   what you do, and honey drops you earn for small money habits.
   Only active for editions that ship illustrations (skin.nookImg).
   ========================================================================== */
const NOOK = !!(SKIN.nookImg && SKIN.nookImg["room-day"]);
const nookImg = (k) => (SKIN.nookImg && SKIN.nookImg[k]) || "";
const NOOK_PETS = {
  mochi: { name: "Mochi", kind: "capybara", cost: 0, line: "Calm money, sweet days.", poses: { idle: "mochi-idle", coin: "mochi-coin", happy: "mochi-happy", sleep: "mochi-sleep", cheer: "mochi-cheer" } },
  bun: { name: "Bun", kind: "bunny", cost: 20, line: "Small steps, soft heart.", poses: { idle: "bun-idle", coin: "bun-idle", happy: "bun-idle", sleep: "bun-idle", cheer: "bun-idle" } },
};
const NOOK_ROOMS = {
  "room-day": { name: "Golden hour", cost: 0 },
  "room-winter": { name: "Snowy evening", cost: 25 },
};
// How honey drops are earned (per day caps keep it calm, not grindy).
const NOOK_EARN = {
  spend: { label: "Track a spend", n: 1, cap: 5 },
  bill: { label: "Tick off a bill or payday", n: 2, cap: 6 },
  checkin: { label: "Daily check-in", n: 2, cap: 2 },
  envelope: { label: "Set money aside", n: 2, cap: 4 },
  fresh: { label: "Start from today (balance check)", n: 3, cap: 3 },
  close: { label: "Close your day (evening recap)", n: 3, cap: 3 },
  pat: { label: "Say hello to your friend", n: 1, cap: 3 },
};
let nookQuiet = false; // no rewards while sample data is being generated
let nookPending = null; // reaction to play after the next render

const nookPet = () => NOOK_PETS[S.nook?.pet] || NOOK_PETS.mochi;
function nookEarn(reason) {
  if (!NOOK || nookQuiet || !S.nook) return 0;
  const rule = NOOK_EARN[reason];
  if (!rule) return 0;
  const key = `${todayISO()}:${reason}`;
  const got = S.nook.log[key] || 0;
  if (got >= rule.cap) { nookPending ||= { mood: "happy" }; return 0; }
  const n = Math.min(rule.n, rule.cap - got);
  S.nook.log[key] = got + n;
  S.nook.drops = (S.nook.drops || 0) + n;
  // Keep the log to the last few weeks.
  const cutoff = addDays(todayISO(), -21);
  for (const k of Object.keys(S.nook.log)) if (k.slice(0, 10) < cutoff) delete S.nook.log[k];
  nookPending = { mood: "cheer", text: `+${n} 🍯` };
  return n;
}
/** Morning, day, golden hour or night — the room follows the clock. */
function nookTime(d = new Date()) {
  const h = d.getHours();
  return h >= 21 || h < 6 ? "night" : h < 10 ? "morning" : h >= 17 ? "golden" : "day";
}
function nookRoom(d = new Date()) {
  const pick = S.nook?.room || "auto";
  if (pick !== "auto" && S.nook.owned.includes(pick) && nookImg(pick)) return pick;
  const m = d.getMonth();
  return (m === 11 || m <= 1) && nookImg("room-winter") ? "room-winter" : "room-day";
}
function nookLine(a) {
  const pet = nookPet();
  if (nookTime() === "night") return `Zzz… your bills are covered. Sleep well.`;
  if (!a) return pet.line;
  if (a.checkedDays == null) return "Hi! Tell me your balance and I'll work out today.";
  if (a.stale) return "Welcome back! Let's start from today — no catching up.";
  if (a.confirmPayday) return "Is it payday? Let's check it in together!";
  if (a.shortBy) return "A tight stretch. We'll make room around it, gently.";
  if (a.leftToday > 0) return `${money(a.leftToday)} left for today. You've got this.`;
  return "Today's guide is used up — tomorrow resets, no stress.";
}
function nookPose(a) {
  if (nookTime() === "night") return "sleep";
  if (a && a.leftToday > 0 && !a.shortBy) return "coin";
  return "idle";
}
/** The room, the companion and its speech bubble. `inner` is what floats on the glass card. */
function nookScene({ a = null, inner = "", size = "hero" } = {}) {
  const pet = nookPet(), pose = nookPose(a), room = nookRoom(), time = nookTime();
  const snow = room === "room-winter" ? `<div class="nook-snow" aria-hidden="true">${Array.from({ length: 18 }, (_, i) => `<i style="--x:${(i * 53) % 100}%;--d:${6 + (i % 5)}s;--w:${(i * 7) % 6}s"></i>`).join("")}</div>` : "";
  const motes = `<div class="nook-motes" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i style="--x:${48 + ((i * 37) % 48)}%;--y:${12 + ((i * 23) % 60)}%;--d:${5 + (i % 4)}s;--w:${(i * 3) % 5}s"></i>`).join("")}</div>`;
  return `<div class="nook nook-${size}" data-time="${time}" data-room="${room}">
    <img class="nook-bg" src="${nookImg(room)}" alt="" aria-hidden="true" draggable="false">
    <div class="nook-light" aria-hidden="true"></div>
    ${snow}${motes}
    ${inner ? `<div class="nook-card">${inner}</div>` : ""}
    <div class="nook-friend">
      <div class="nook-bubble" role="status">${esc(nookLine(a))}</div>
      <button class="nook-pet pose-${pose}" data-action="nook-pat" aria-label="Say hello to ${esc(pet.name)}" title="Say hello to ${esc(pet.name)}">
        <img src="${nookImg(pet.poses[pose])}" alt="" draggable="false">
      </button>
      <div class="nook-shadow" aria-hidden="true"></div>
    </div>
    <a class="nook-drops" href="#nook" title="Your honey drops">🍯 <b>${S.nook.drops || 0}</b><span>honey drops</span></a>
  </div>`;
}
/** Play the companion's reaction after a render (swap pose, hop, floating reward). */
function nookAfterRender() {
  if (!NOOK || !nookPending) return;
  const p = nookPending;
  nookPending = null;
  const btn = $(".nook-pet");
  if (!btn) return;
  const pet = nookPet();
  const img = btn.querySelector("img");
  const rest = img.getAttribute("src");
  img.src = nookImg(pet.poses[p.mood] || pet.poses.happy);
  btn.classList.add("react");
  if (p.text) {
    const f = document.createElement("div");
    f.className = "nook-float";
    f.textContent = p.text;
    btn.parentElement.appendChild(f);
    setTimeout(() => f.remove(), 1600);
  }
  if (p.say) { const b = $(".nook-bubble"); if (b) b.textContent = p.say; }
  setTimeout(() => { btn.classList.remove("react"); if (img.isConnected) img.src = rest; }, 1900);
}

/* ---------- Page ---------- */
function viewNook() {
  const a = SKIN.balance ? availableSummary() : null;
  const pets = Object.entries(NOOK_PETS).filter(([, p]) => nookImg(p.poses.idle));
  const today = todayISO();
  return `
  ${pageHead("The Honey Nook", "A little room that grows with your money habits. Earn honey drops for small steps — never for being perfect.")}
  ${nookScene({ a, size: "page" })}
  <div class="grid g2 mt">
    <div class="card">
      <div class="card-head"><h2>Your friends</h2><span class="tiny">🍯 ${S.nook.drops} drops</span></div>
      <div class="nook-pets">${pets.map(([id, p]) => {
        const own = S.nook.owned.includes(id), on = S.nook.pet === id;
        return `<button class="nook-pick ${on ? "on" : ""}" data-action="nook-pet" data-id="${id}" ${!own && S.nook.drops < p.cost ? "disabled" : ""} aria-pressed="${on}">
          <img src="${nookImg(p.poses.idle)}" alt="">
          <b>${esc(p.name)}</b><span>${on ? "With you now" : own ? "Tap to switch" : `Unlock · 🍯 ${p.cost}`}</span></button>`;
      }).join("")}
        <div class="nook-pick soon" aria-hidden="true"><span class="q">?</span><b>More friends</b><span>Coming in updates</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Rooms</h2></div>
      <div class="nook-rooms">${[["auto", { name: "Follow the season", cost: 0 }], ...Object.entries(NOOK_ROOMS)].filter(([id]) => id === "auto" || nookImg(id)).map(([id, r]) => {
        const own = id === "auto" || S.nook.owned.includes(id), on = (S.nook.room || "auto") === id;
        return `<button class="nook-room ${on ? "on" : ""}" data-action="nook-room" data-id="${id}" ${!own && S.nook.drops < r.cost ? "disabled" : ""} aria-pressed="${on}">
          ${id === "auto" ? `<span class="nook-room-auto">🍂❄️🌸</span>` : `<img src="${nookImg(id)}" alt="">`}
          <b>${esc(r.name)}</b><span>${on ? "Showing now" : own ? "Tap to use" : `Unlock · 🍯 ${r.cost}`}</span></button>`;
      }).join("")}</div>
    </div>
  </div>
  <div class="card mt">
    <div class="card-head"><h2>How to earn honey drops</h2><span class="tiny">Small daily limits — it's a cozy game, not a chore</span></div>
    <div class="list">${Object.entries(NOOK_EARN).map(([k, r]) => { const got = S.nook.log[`${today}:${k}`] || 0; return `<div class="li"><div class="name">${esc(r.label)}<small>up to ${r.cap} a day</small></div><div class="amt">+${r.n} 🍯</div><span class="pill ${got >= r.cap ? "good" : "muted"}">${got >= r.cap ? "done today" : `${got}/${r.cap}`}</span></div>`; }).join("")}</div>
  </div>`;
}

/* ---------- Wiring ---------- */
if (NOOK) {
  // Reward the habits where they happen.
  const baseAddTx = addTx;
  addTx = function (tx) {
    const t = baseAddTx(tx);
    if (t.link) nookEarn("bill"); else if (t.type === "expense") nookEarn("spend");
    return t;
  };
  const baseCheckBalance = checkBalance;
  checkBalance = function (amount, openFrom) { baseCheckBalance(amount, openFrom); nookEarn("fresh"); };
  const baseRender = render;
  render = function () { baseRender(); nookAfterRender(); };
  const baseSample = loadSample;
  loadSample = function () {
    nookQuiet = true;
    try { baseSample(); } finally { nookQuiet = false; }
    S.nook = { pet: "mochi", drops: 38, owned: ["mochi", "room-day"], room: "auto", log: {} };
    nookPending = null;
    saveNow();
    render();
  };
  const at = (id) => NAV.findIndex((n) => n.id === id);
  NAV.splice(at("home") + 1, 0, { id: "nook", label: "Honey Nook", icon: "sparkle" });
  VIEWS.nook = viewNook;
  const baseCheckin = ACTIONS.checkin;
  if (baseCheckin) ACTIONS.checkin = (el, e) => { nookEarn("checkin"); return baseCheckin(el, e); };
}
Object.assign(ACTIONS, {
  "nook-pat": () => {
    const pet = nookPet();
    const lines = [`${pet.name} is so happy to see you!`, "You're doing better than you think.", "One small step today is plenty.", "Proud of you for checking in 🍯", pet.line];
    const n = nookEarn("pat");
    nookPending = { mood: "happy", text: n ? `+${n} 🍯` : "♡", say: lines[Math.floor(Math.random() * lines.length)] };
    save();
    if (n) render(); else nookAfterRender();
  },
  "nook-pet": (el) => {
    const id = el.dataset.id, p = NOOK_PETS[id];
    if (!p) return;
    if (!S.nook.owned.includes(id)) {
      if (S.nook.drops < p.cost) return toast(`Earn ${p.cost - S.nook.drops} more honey drops to meet ${p.name}`);
      S.nook.drops -= p.cost;
      S.nook.owned.push(id);
      celebrate("🍯", `${p.name} moved in!`, p.line);
    }
    S.nook.pet = id;
    nookPending = { mood: "cheer", say: `Hi! I'm ${p.name}. ${p.line}` };
    commit();
  },
  "nook-room": (el) => {
    const id = el.dataset.id;
    if (id !== "auto" && !S.nook.owned.includes(id)) {
      const r = NOOK_ROOMS[id];
      if (S.nook.drops < r.cost) return toast(`Earn ${r.cost - S.nook.drops} more honey drops for this room`);
      S.nook.drops -= r.cost;
      S.nook.owned.push(id);
      celebrate("✨", `${r.name} unlocked`, "Your nook has a new look.");
    }
    S.nook.room = id;
    commit();
  },
});

/* 10-today.js */
/* ==========================================================================
   Today tools (balance mode): the animated number, the forecast until
   payday, "Just today" mode, the evening recap and "I forgot to log".
   ========================================================================== */

/* ---------- Animated number ---------- */
let tdShown = null; // last value the big number showed, so it only counts when it changes
function countUp() {
  const el = $(".avail[data-count]");
  if (!el) return;
  const to = Number(el.dataset.count), from = tdShown;
  tdShown = to;
  // Automated screenshots stay still unless a demo recording asks for motion.
  const still = S.settings.motion === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches || (navigator.webdriver && !window.__motionDemo);
  if (still || from === to) return;
  const start = from ?? 0, t0 = performance.now(), dur = from == null ? 1100 : 650;
  el.classList.add("counting");
  el.innerHTML = moneyHTML(start);
  const step = (t) => {
    if (!el.isConnected) return;
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = moneyHTML(k < 1 ? start + (to - start) * e : to);
    if (k < 1) requestAnimationFrame(step); else el.classList.remove("counting");
  };
  requestAnimationFrame(step);
}

/* ---------- Forecast until payday ---------- */
/** End-of-day balance from today to payday if you spend your daily guide and pay every bill on its date. */
function paydayForecast(a = availableSummary()) {
  if (a.confirmPayday || a.days <= 0 || a.checkedDays == null) return null;
  const pts = [], events = [];
  let bal = a.balance + (a.extra || 0);
  for (let i = 0; i <= a.days; i++) {
    const d = addDays(a.today, i);
    const due = a.due.filter((o) => (i === 0 ? o.date <= d : o.date === d));
    for (const o of due) bal -= o.amount;
    if (due.length) events.push({ i, d, items: due });
    if (i < a.days) bal -= i === 0 ? Math.max(0, a.leftToday) : a.guide;
    pts.push({ i, d, v: round2(bal) });
  }
  const low = pts.reduce((m, p) => (p.v < m.v ? p : m), pts[0]);
  return { start: a.balance + (a.extra || 0), pts, events, low, end: pts.at(-1).v, pay: a.pay.occ ? a.pay.occ.amount : 0, h: a.h };
}
function forecastChart(f) {
  // The line stretches with the card (SVG without aspect ratio); dots and labels are HTML so they stay round and readable.
  const W = 1000, H = 100;
  const n = f.pts.length;
  const vals = [f.start, ...f.pts.map((p) => p.v)];
  const lo = Math.min(0, ...vals), hi = Math.max(...vals) * 1.04 || 1;
  const xp = (i) => ((i + 0.5) / n) * 100; // percent
  const yp = (v) => (1 - (v - lo) / (hi - lo || 1)) * 100;
  const line = [[0, yp(f.start)], ...f.pts.map((p) => [xp(p.i), yp(p.v)])];
  const path = line.map(([px, py], i) => `${i ? "L" : "M"}${(px * W / 100).toFixed(1)} ${py.toFixed(2)}`).join(" ");
  const area = `${path} L${(xp(n - 1) * W / 100).toFixed(1)} ${H} L0 ${H} Z`;
  const zero = lo < 0 ? `<line class="fc-zero" x1="0" x2="${W}" y1="${yp(0).toFixed(2)}" y2="${yp(0).toFixed(2)}" vector-effect="non-scaling-stroke"/>` : "";
  const pos = (i, v) => `left:${xp(i).toFixed(2)}%;top:${yp(v).toFixed(2)}%`;
  const marks = f.events.map((e) => {
    const p = f.pts[e.i];
    const tip = e.items.map((o) => `${o.name} ${money(o.amount)}`).join(", ");
    return `<span class="fc-ev" style="${pos(e.i, p.v)}" title="${esc(`${fmtDay(e.d)}: ${tip}`)}"><em>${esc(e.items.map((o) => o.emoji || "•").slice(0, 2).join(""))}</em></span>`;
  }).join("");
  const low = f.low.v < f.start && !f.events.some((e) => e.i === f.low.i) ? `<span class="fc-low" style="${pos(f.low.i, f.low.v)}"></span>` : "";
  const pay = `<span class="fc-pay" style="left:${xp(n - 1).toFixed(2)}%"><b>${f.pay ? `Payday +${esc(moneyRound(f.pay))}` : S.account.irregular ? "Stretch ends" : "Payday"}</b></span>`;
  const ticks = [...new Set([0, Math.floor((n - 1) / 2), n - 1])].map((i) => `<span style="left:${xp(i).toFixed(2)}%">${i === 0 ? "Today" : esc(fmtDay(f.pts[i].d))}</span>`).join("");
  return `<div class="fc-plot" role="img" aria-label="Your balance until payday: lowest ${esc(money(f.low.v))} on ${esc(fmtDay(f.low.d))}">
    <svg class="fc-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="fcFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".24"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#fcFill)"/>${zero}<path class="fc-line" d="${path}" vector-effect="non-scaling-stroke"/>
    </svg>${pay}${marks}${low}
  </div>
  <div class="fc-x" aria-hidden="true">${ticks}</div>`;
}
function forecastCard(a) {
  const f = paydayForecast(a);
  if (!f) return "";
  const dip = f.low.v < 0;
  return `<div class="card fc-card focus-hide">

/* ---------- Evening recap & closing streak ---------- */
function closedStreak() {
  let n = 0, d = todayISO();
  if (!S.dayClosed[d]) d = addDays(d, -1);
  while (S.dayClosed[d]) { n++; d = addDays(d, -1); }
  return n;
}
const todaysSpends = (today) => S.transactions.filter((t) => t.date === today && t.type === "expense" && !t.link);
function tomorrowGuide(a) {
  return a.days > 1 ? Math.floor((a.available * 100) / (a.days - 1)) / 100 : null;
}

    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Add spends</button>`,

      const rows = [];

      if (!rows.length) { toast("Enter at least one amount"); return false; }

/* ---------- Search everything ---------- */
function searchAll(q) {
  const s = q.trim().toLowerCase();
  if (!s) return { groups: [], tx: [] };
  const has = (...v) => v.some((x) => String(x || "").toLowerCase().includes(s));
  const amt = /^[\d.,]+$/.test(s) ? parseAmount(s) : NaN;
  const tx = S.transactions
    .filter((t) => has(t.name, t.note, catById(t.catId)?.name) || (amt > 0 && Math.abs(t.amount - amt) < 0.005))
    .sort(by((t) => (t.date === undefined ? "" : t.date))).reverse();
  const groups = [];
  const add = (label, items) => { if (items.length) groups.push({ label, items: items.slice(0, 6) }); };
  add("Pages", NAV.filter((n) => n.id && VIEWS[n.id] && has(n.label)).map((n) => ({ go: n.id, ic: n.icon, name: n.label, sub: "Open page" })));
  add("Spends & income", tx.slice(0, 8).map((t) => ({ act: "edit-tx", id: t.id, ic: t.type === "income" ? "wallet" : "receipt", name: `${catById(t.catId)?.emoji || ""} ${t.name}`.trim(), sub: fmtDay(t.date), amt: t.type === "income" ? t.amount : -t.amount })));
  add("Bills & subscriptions", S.bills.filter((b) => has(b.name, b.note)).map((b) => ({ act: "edit-bill", id: b.id, ic: "receipt", name: `${b.emoji || ""} ${b.name}`.trim(), sub: FREQS[b.freq] || "Bill", amt: -b.amount })));
  if (BAL) add("Envelopes", S.envelopes.filter((e) => has(e.name)).map((e) => ({ act: "edit-envelope", id: e.id, ic: "envelope", name: `${e.emoji || "✉️"} ${e.name}`, sub: "Envelope", amt: e.amount })));
  add("Goals & savings", [...S.goals.filter((g) => has(g.name)).map((g) => ({ act: "edit-goal", id: g.id, ic: "target", name: `${g.emoji || ""} ${g.name}`.trim(), sub: "Goal" })),
    ...S.funds.filter((f) => has(f.name)).map((f) => ({ go: "savings", ic: "piggy", name: `${f.emoji || ""} ${f.name}`.trim(), sub: "Savings fund" }))]);
  if (BAL) add("Money back", S.moneyBack.filter((m) => has(m.name, m.note)).map((m) => ({ go: "moneyback", ic: "repeat", name: m.name, sub: m.status === "waiting" ? `Waiting · by ${fmtDay(m.due)}` : "Done", amt: m.amount })));
  return { groups, tx };
}

function headsUp(a) {
  const out = [];
  const soon = addDays(a.today, 1);
  for (const o of a.due.filter((x) => x.date <= soon).slice(0, 3)) {
    const when = o.date < a.today ? `was due ${relDay(o.date).toLowerCase()}` : o.date === a.today ? "is due today" : "is due tomorrow";
    out.push({ e: o.date < a.today ? "⏰" : "🔔", cls: o.date < a.today ? "late" : "", html: `<b>${esc(o.name)}</b> ${when} · <b class="m">${money(o.amount)}</b>`, btn: `<button class="btn sm" data-action="toggle-occ" data-key="${esc(o.key)}">${icon("check", 15)}Paid</button>` });
  }
  for (const m of S.moneyBack.filter((x) => x.status === "waiting" && x.due && diffDays(a.today, x.due) <= 3).slice(0, 2)) {
    const d = diffDays(a.today, m.due);
    out.push({ e: "↩️", html: `<b>${esc(m.name)}</b> — ${d < 0 ? "deadline passed" : d === 0 ? "last day today" : `${plural(d, "day")} left`}`, btn: `<a class="btn sm" href="#moneyback">Open</a>` });
  }
  const lb = S.settings.lastBackup;
  if (!IS_DEMO && S.transactions.length >= 10 && (!lb || diffDays(lb, a.today) >= 14)) {
    out.push({ e: "💾", html: `${lb ? `Last backup ${plural(diffDays(lb, a.today), "day")} ago.` : "No backup yet."} Your budget lives only in this browser — save a copy.`, btn: `<button class="btn sm" data-action="export-json">${icon("download", 15)}Back up</button>` });
  }
  if (!S.settings.icsDone && S.bills.length >= 3 && !IS_DEMO) {

  if (!out.length) return "";

}

  { id: "log7", e: "✍️", name: "Track every day", desc: "Open your planner and track or close your day 7 days in a row.", len: 7, need: 7, reward: 10, test: (d) => !!(S.checkins[d] || S.dayClosed[d]) },
  { id: "takeout14", e: "🥡", name: "No takeout fortnight", desc: "Two weeks without delivery apps or eating out.", len: 14, need: 14, reward: 20, test: (d) => !spendsOn(d).some(isTakeout) },
];
const challengeById = (id) => CHALLENGES.find((c) => c.id === id);
/** Day-by-day status of a challenge. Past days are final; today counts once the day is closed (or already met for "track every day"). */
function challengeProgress(cur = S.challenge, today = todayISO()) {
  const c = cur && challengeById(cur.id);
  if (!c) return null;
  const days = Array.from({ length: c.len }, (_, i) => addDays(cur.start, i)).map((d) => {
    if (d > today) return { d, st: "future" };
    const ok = c.test(d);
    if (d < today) return { d, st: ok ? "ok" : "miss" };
    return { d, st: ok && (S.dayClosed[d] || c.id === "log7") ? "ok" : "today" };
  });
  const ok = days.filter((x) => x.st === "ok").length;
  const open = days.filter((x) => x.st === "future" || x.st === "today").length;
  return { c, start: cur.start, days, ok, open, done: ok >= c.need, failed: ok + open < c.need, end: addDays(cur.start, c.len - 1) };
}
function challengeDots(p) {
  return `<div class="ch-dots">${p.days.map((x) => `<i class="${x.st}" title="${esc(fmtDay(x.d))}">${x.st === "ok" ? "✓" : DOW[fromISO(x.d).getDay()][0]}</i>`).join("")}</div>`;
}
function challengeCard(p, compact = false) {
  const { c } = p;
  const state = p.done ? `<p class="ch-state good">Challenge complete! ${NOOK ? `Claim your ${c.reward} honey drops.` : "Claim your badge."}</p>`
    : p.failed ? `<p class="ch-state">Not this time — that's okay. Every try teaches you something.</p>`
    : `<p class="tiny">${p.ok} of ${c.need} done · ends ${esc(fmtDay(p.end))}</p>`;
  const btn = p.done ? `<button class="btn primary sm" data-action="ch-claim">${NOOK ? `Claim ${c.reward} 🍯` : "Claim"}</button>`
    : p.failed ? `<button class="btn sm" data-action="ch-start" data-id="${c.id}">Try again</button><button class="link-btn" data-action="ch-stop">Pick another</button>`
    : compact ? `<a class="link-sm" href="#challenges">Details</a>` : `<button class="link-btn" data-action="ch-stop">Stop this challenge</button>`;
  return `<div class="card ch-card ${p.done ? "done" : ""}">
    <div class="card-head"><h2><span class="ch-e">${c.e}</span> ${esc(c.name)}</h2>${compact ? `<span class="tiny">Challenge</span>` : ""}</div>
    ${compact ? "" : `<p class="muted">${esc(c.desc)}</p>`}
    ${challengeDots(p)}
    ${state}
    <div class="row wrap mt-s">${btn}</div>
  </div>`;
}
function viewChallenges() {
  const p = challengeProgress();
  const doneCount = (id) => S.challengesDone.filter((x) => x.id === id).length;
  return `
  ${pageHead("Challenges", "One small, kind challenge at a time. Finish it to earn a reward — miss a day and simply try again.")}
  ${p ? challengeCard(p) : `<div class="card">${empty("🌱", "No challenge running", "Pick one below — they last one or two weeks.")}</div>`}
  <div class="grid g3 mt">${CHALLENGES.filter((c) => c.id !== p?.c.id).map((c) => `<div class="card ch-pick">
      <div class="ch-e big">${c.e}</div>
      <h3>${esc(c.name)}</h3>
      <p class="tiny">${esc(c.desc)}</p>
      <div class="row between mt"><span class="tiny">${plural(c.len, "day")}${NOOK ? ` · ${c.reward} 🍯` : ""}${doneCount(c.id) ? ` · done ${doneCount(c.id)}×` : ""}</span><button class="btn sm" data-action="ch-start" data-id="${c.id}">${p ? "Switch" : "Start"}</button></div>
    </div>`).join("")}</div>
  <p class="tiny mt">${S.challengesDone.length ? `🏆 ${plural(S.challengesDone.length, "challenge")} completed so far.` : "Your completed challenges will be counted here."}</p>`;
}

/* ---------- Wiring ---------- */
if (BAL) {

document.addEventListener("keydown", (e) => {

const baseIcs = ACTIONS["export-ics"];
if (baseIcs) ACTIONS["export-ics"] = (el, e) => { const r = baseIcs(el, e); if (!S.settings.icsDone) { S.settings.icsDone = true; commit(); } return r; };

/* 12-income.js */
/* ==========================================================================
   Irregular income (balance mode): no fixed payday — freelance, tips or gig
   work. You choose how long the money in your account has to last.
   ========================================================================== */
const IRREG = () => BAL && !!S.account.irregular;
function stretchChoices(today = todayISO()) {
  return [
    ["7", "1 week", addDays(today, 7)],
    ["14", "2 weeks", addDays(today, 14)],
    ["28", "4 weeks", addDays(today, 28)],
    ["eom", "End of month", monthEnd(monthKey(today)) > today ? monthEnd(monthKey(today)) : monthEnd(monthKey(addDays(today, 1)))],
  ];
}
/** The home banner when a stretch is over. */
function stretchBanner(a) {
  if (!IRREG() || !a.pay.ended) return "";
  return `<div class="fresh-banner"><div><b>Your stretch is over 🌱</b><span>How long should the money in your account last now? Update your balance first if money came in.</span></div><button class="btn primary sm" data-action="pay-style">Plan next stretch</button></div>`;
}
function openPayStyle() {
  const today = todayISO();
  let irregular = !!S.account.irregular;
  const cur = S.account.horizon && S.account.horizon > today ? S.account.horizon : addDays(today, 14);
  const picks = stretchChoices(today);
  const body = () => `
    <div class="seg" style="margin-bottom:14px">${[["0", "Regular paychecks"], ["1", "Irregular income"]].map(([v, l]) => `<button type="button" class="${(v === "1") === irregular ? "on" : ""}" data-style="${v}">${l}</button>`).join("")}</div>
    ${irregular ? `<p class="muted">Freelance, tips, gig work or benefits that move around? Choose how long the money in your account has to last. Bills due before then are protected first.</p>
      <div class="chips mt">${picks.map(([k, l, d]) => `<button type="button" class="chip ${d === cur ? "on" : ""}" data-until="${d}">${l} · until ${esc(fmtDay(d))}</button>`).join("")}</div>
      <div class="form-grid mt">${field("Or pick the day money arrives", inp("until", cur, `type="date" min="${addDays(today, 1)}"`), "full")}</div>
      <p class="tiny mt-s">When money comes in, add it as income or update your balance — your number grows right away.</p>`
      : `<p class="muted">Your number lasts until your next payday. ${S.incomes.length ? `Main paycheck: <b>${esc(primaryIncome()?.name || "Paycheck")}</b> · ${money(primaryIncome()?.amount || 0)} ${esc((FREQS[primaryIncome()?.freq] || "").toLowerCase())}.` : `Add your paycheck in <a href="#paycheck">Paycheck plan</a>.`}</p>`}`;
  const form = openModal({
    title: "How you get paid",
    body: body(),
    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button>`,
    onSubmit: (d) => {
      const undo = snapshot();
      S.account.irregular = irregular;
      if (irregular) {
        const until = d.until && d.until > today ? d.until : addDays(today, 14);
        S.account.horizon = until;
        commit(`Your money now lasts until ${fmtDay(until)}`, undo);
      } else commit("Back to regular paychecks", undo);
    },
  });
  const wire = () => {
    form.querySelectorAll(".modal-body a[href^='#']").forEach((x) => x.addEventListener("click", closeModal));
    form.querySelectorAll("[data-style]").forEach((b) => b.addEventListener("click", () => { irregular = b.dataset.style === "1"; form.querySelector(".modal-body").innerHTML = body(); wire(); }));
    form.querySelectorAll("[data-until]").forEach((b) => b.addEventListener("click", () => {
      form.querySelector("[name=until]").value = b.dataset.until;
      form.querySelectorAll("[data-until]").forEach((x) => x.classList.toggle("on", x === b));
    }));
  };
  wire();
}
Object.assign(ACTIONS, { "pay-style": () => openPayStyle() });

/* 13-accounts.js */
/* ==========================================================================
   Move to another device (share the backup file), and other accounts in
   balance mode: cash, savings and cards next to the spending account.
   ========================================================================== */

/* ---------- Send to my other device ---------- */
async function sendToDevice() {
  if (IS_DEMO) return toast("Moving devices is part of the full version");
  const name = `${APP_NAME.replace(/\s/g, "-").toLowerCase()}-backup-${todayISO()}.json`;
  const text = JSON.stringify(S, null, 1);
  S.settings.lastBackup = todayISO();
  saveNow();
  let file = null;
  try { file = new File([text], name, { type: "application/json" }); } catch { file = null; }
  if (file && navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: `${APP_NAME} backup`, text: `Open your planner on the other device → Settings → Restore backup, then choose this file.` });
      render();
      toast("Sent! On the other device: Settings → Restore backup");
      return;
    } catch (e) { if (e?.name === "AbortError") { render(); return; } }
  }
  download(name, text);
  render();
  openModal({
    title: "Move to another device",
    body: `<p class="muted">Your planner was saved as a file. Three small steps:</p>
      <ol class="steps-list mt">
        <li><b>Send the file to yourself</b> — AirDrop, email, WhatsApp, Google Drive or a USB stick.</li>
        <li><b>Open your planner on the other device</b> — the same private link or the offline file.</li>
        <li><b>Settings → Restore backup</b> and choose the file. Everything appears, exactly as here.</li>
      </ol>
      <p class="tiny mt">There's no account and no cloud: your budget only moves when you move it.</p>`,
    foot: `<button class="btn primary">Got it</button>`,
  });
}

/* ---------- Other accounts (balance mode) ---------- */
const ACCOUNT_KINDS = { cash: ["💵", "Cash"], savings: ["🐷", "Savings"], card: ["💳", "Credit card"], other: ["🏦", "Other account"] };
/** Money in other accounts that counts in today's number (never cards). */
function extraBalance() { return round2(sum((S.accounts || []).filter((x) => x.include && x.kind !== "card"), (x) => x.balance)); }
function accountsTotals() {
  const main = balanceNow();
  const have = round2(main + sum(S.accounts.filter((x) => x.kind !== "card"), (x) => x.balance));
  const owed = round2(sum(S.accounts.filter((x) => x.kind === "card"), (x) => x.balance));
  return { main, have, owed, net: round2(have - owed), counted: extraBalance() };
}
function viewAccounts() {
  const t = accountsTotals(), a = availableSummary();
  const row = (x) => {
    const [e, k] = ACCOUNT_KINDS[x.kind] || ACCOUNT_KINDS.other;
    return `<div class="card acct-card">
      <div class="card-head"><h3>${e} ${esc(x.name)}</h3><button class="btn ghost icon-btn" data-action="edit-account" data-id="${x.id}" aria-label="Edit ${esc(x.name)}">${icon("edit")}</button></div>
      <div class="fund-amt ${x.kind === "card" ? "neg" : ""}">${moneyHTML(x.balance)}</div>
      <p class="tiny">${k}${x.kind === "card" ? " · owed" : ""}${x.checkedOn ? ` · updated ${esc(fmtDay(x.checkedOn))}` : ""}</p>
      ${x.kind === "card" ? `<p class="tiny mt-s">Card payments come from your bills — add the payment as a bill or debt so it's protected.</p>`
        : `<label class="check mt-s"><input type="checkbox" data-input="acct-include" data-id="${x.id}" ${x.include ? "checked" : ""}> Count in today's number</label>`}
    </div>`;
  };
  return `
  ${pageHead("Accounts", "Your spending account powers today's number. Add cash, savings or cards to see everything in one place.", `<button class="btn primary" data-action="add-account">${icon("plus")}Add account</button>`)}
  <div class="grid g3">
    <div class="tile accent"><div class="label">Everything you have</div><div class="value">${moneyHTML(t.have)}</div><div class="sub">across ${plural(1 + S.accounts.filter((x) => x.kind !== "card").length, "account")}</div></div>
    <div class="tile ${t.owed ? "" : "good"}"><div class="label">Owed on cards</div><div class="value">${moneyHTML(t.owed)}</div><div class="sub">${t.owed ? "not part of today's number" : "nothing owed 🎉"}</div></div>
    <div class="tile good"><div class="label">Available until ${esc(fmtDay(a.h))}</div><div class="value">${moneyHTML(a.available)}</div><div class="sub">${t.counted ? `includes ${money(t.counted)} from other accounts` : "from your spending account"}</div></div>
  </div>
  <div class="grid g3 mt">
    <div class="card acct-card main">
      <div class="card-head"><h3>🌿 ${esc(S.account.name || "Spending account")}</h3><span class="tiny">Main</span></div>
      <div class="fund-amt">${moneyHTML(t.main)}</div>
      <div class="fresh-line tiny">${freshness(a)}</div>
      <button class="btn sm mt-s" data-action="fresh-start">Update balance</button>
    </div>
    ${S.accounts.map(row).join("")}
    <button class="card acct-add" data-action="add-account">${icon("plus", 22)}<span>Add cash, savings or a card</span></button>
  </div>
  <p class="tiny mt">Spending from cash? Track it as usual, then update the cash balance when you count it — your number stays right in between.</p>`;
}
function openAccountForm(acc = null) {
  const x = acc || { name: "", kind: "cash", balance: "", include: true };
  openModal({
    title: acc ? "Edit account" : "Add an account",
    body: `<div class="form-grid">
      ${field("Name", inp("name", x.name, 'placeholder="e.g. Cash wallet" maxlength="40" required autofocus'))}
      ${field("Type", sel("kind", Object.entries(ACCOUNT_KINDS).map(([k, [e, l]]) => [k, `${e} ${l}`]), x.kind))}
      ${field("Balance right now", moneyInp("balance", x.balance, 'min="0"'), "full", "for a card: what you owe")}
      <div class="full">${chk("include", x.include, "Count it in today's number (cash you can spend)")}</div>
    </div>`,
    foot: `${acc ? `<button type="button" class="btn danger left" data-del>${icon("trash")}Delete</button>` : ""}<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${acc ? "Save" : "Add"}</button>`,
    onSubmit: (d) => {
      const name = (d.name || "").trim();
      if (!name) { toast("Give it a name"); return false; }
      const rec = { name, kind: d.kind, balance: round2(Math.max(0, num(d.balance))), include: d.kind !== "card" && !!d.include, checkedOn: todayISO() };
      const undo = snapshot();
      if (acc) Object.assign(acc, rec); else S.accounts.push({ id: uid(), ...rec });
      commit(acc ? "Account saved" : `${name} added`, undo);
    },
    onMount: (form) => form.querySelector("[data-del]")?.addEventListener("click", () => {
      const undo = snapshot();
      S.accounts = S.accounts.filter((y) => y !== acc);
      closeModal();
      commit(`${acc.name} removed`, undo);
    }),
  });
}

/* ---------- Wiring ---------- */
if (BAL) {
  const at = (id) => NAV.findIndex((n) => n.id === id);
  NAV.splice(at("envelopes") + 1, 0, { id: "accounts", label: "Accounts", icon: "wallet" });

}
Object.assign(ACTIONS, {

  "add-account": () => openAccountForm(),

});

});

/* 14-season.js */
/* ==========================================================================
   Seasonal touches in the Honey Nook: falling leaves, Halloween pumpkins,
   holiday gifts, Valentine hearts and spring petals (Settings → Appearance).
   ========================================================================== */
const SEASONS = {
  halloween: { label: "Halloween week", e: "🎃", fall: "leaf", deco: ["🎃", "🎃"], line: "Happy Halloween! Treats fit in your guide 🎃" },
  autumn: { label: "Cozy autumn", e: "🍂", fall: "leaf", line: "Cozy season — a warm drink at home is a small win 🍂" },
  holidays: { label: "Holiday season", e: "🎄", fall: "", deco: ["🎁", "🎄"], line: "Gifts feel lighter with an envelope for them 🎁" },
  valentine: { label: "Valentine's", e: "💕", fall: "heart", line: "Loving yourself includes your future self 💕" },
  spring: { label: "Spring", e: "🌸", fall: "petal", line: "Fresh start season — perfect for a balance check 🌸" },
  summer: { label: "Summer", e: "☀️", fall: "", line: "Sunny days, calm money ☀️" },
};
function seasonNow(d = new Date()) {
  const m = d.getMonth() + 1, day = d.getDate();
  if (m === 10 && day >= 15) return "halloween";
  if (m === 12) return "holidays";
  if (m === 2 && day <= 14) return "valentine";
  if ((m === 3 && day >= 20) || m === 4 || m === 5) return "spring";
  if ((m === 9 && day >= 22) || m === 10 || m === 11) return "autumn";
  if (m >= 6 && m <= 8) return "summer";
  return "";
}
const seasonOn = () => NOOK && S.settings.seasonal !== false && !!seasonNow();
function seasonLayer(id) {
  const s = SEASONS[id];
  const fall = s.fall ? `<div class="nook-fall fall-${s.fall}" aria-hidden="true">${Array.from({ length: 12 }, (_, i) => `<i style="--x:${(i * 41 + 7) % 100}%;--d:${7 + (i % 5)}s;--w:${(i * 1.7) % 7}s;--r:${(i * 67) % 360}deg">${s.fall === "heart" ? "♥" : ""}</i>`).join("")}</div>` : "";
  const deco = s.deco ? `<div class="nook-deco" aria-hidden="true">${s.deco.map((e, i) => `<span class="d${i}">${e}</span>`).join("")}</div>` : "";
  return `${fall}${deco}<span class="nook-season-chip" title="${esc(s.label)}">${s.e} ${esc(s.label)}</span>`;
}

if (NOOK) {
  const baseScene = nookScene;
  nookScene = function (opts) {
    const html = baseScene(opts);
    if (!seasonOn()) return html;
    const id = seasonNow();
    return html.replace('<div class="nook ', `<div data-season="${id}" class="nook `).replace('<div class="nook-light" aria-hidden="true"></div>', `<div class="nook-light" aria-hidden="true"></div>${seasonLayer(id)}`);
  };
  const baseLine = nookLine;
  nookLine = function (a) {
    const line = baseLine(a);
    // Every other hour, a seasonal hello replaces the everyday encouragement (never over a real heads-up).
    if (seasonOn() && a && a.leftToday > 0 && !a.stale && !a.shortBy && !a.confirmPayday && nookTime() !== "night" && new Date().getHours() % 2 === 0) return SEASONS[seasonNow()].line;
    return line;
  };
}
Object.assign(INPUTS, { seasonal: (el, ev) => { if (ev.type !== "change") return; S.settings.seasonal = el.checked; commit(el.checked ? "Seasonal touches on" : "Seasonal touches off"); } });

})();
