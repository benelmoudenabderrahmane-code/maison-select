<style>
/* ==========================================================================
   Lumi Budget — styles
   Every colour is derived from two numbers (--h hue, --s saturation) so the
   whole app can be re-themed from a palette preset or the custom hue slider.
   ========================================================================== */

:root {
  --h: 345;
  --s: 62%;
  --font-head: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px hsl(var(--h) 30% 30% / .05), 0 8px 24px -12px hsl(var(--h) 30% 30% / .18);
  --shadow-lg: 0 24px 60px -20px hsl(var(--h) 30% 20% / .35);
  --ease: cubic-bezier(.2, .8, .2, 1);

  --bg: hsl(var(--h) 45% 97%);
  --bg-2: hsl(var(--h) 40% 94.5%);
  --surface: hsl(var(--h) 60% 99.4%);
  --surface-2: hsl(var(--h) 45% 97.6%);
  --ink: hsl(var(--h) 25% 14%);
  --head: var(--ink); /* headings; editions may give them their own colour */
  --ink-2: hsl(var(--h) 10% 40%);
  --ink-3: hsl(var(--h) 8% 45%);
  --line: hsl(var(--h) 25% 90%);
  --line-2: hsl(var(--h) 22% 84%);
  --accent: hsl(var(--h) var(--s) 56%);
  --accent-strong: hsl(var(--h) var(--s) 46%);
  --accent-ink: #fff;
  --accent-soft: hsl(var(--h) calc(var(--s) * .9) 92%);
  --accent-softer: hsl(var(--h) calc(var(--s) * .9) 95.5%);
  --accent-btn: var(--accent-strong); /* filled buttons: dark enough for white text */
  --good: hsl(150 45% 29%);
  --good-soft: hsl(150 40% 92%);
  --warn: hsl(35 85% 38%);
  --warn-soft: hsl(40 90% 91%);
  --bad: hsl(0 65% 48%);
  --bad-soft: hsl(0 80% 95%);
  --info: hsl(210 60% 45%);
  --info-soft: hsl(210 70% 94%);
  --overlay: hsl(var(--h) 30% 10% / .38);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: hsl(var(--h) 12% 8%);
  --bg-2: hsl(var(--h) 12% 11%);
  --surface: hsl(var(--h) 11% 12%);
  --surface-2: hsl(var(--h) 11% 15%);
  --ink: hsl(var(--h) 25% 94%);
  --ink-2: hsl(var(--h) 10% 70%);
  --ink-3: hsl(var(--h) 8% 60%);
  --line: hsl(var(--h) 10% 20%);
  --line-2: hsl(var(--h) 10% 27%);
  --accent: hsl(var(--h) var(--s) 68%);
  --accent-strong: hsl(var(--h) var(--s) 74%);
  --accent-ink: hsl(var(--h) 30% 10%);
  --accent-btn: var(--accent);
  --accent-soft: hsl(var(--h) calc(var(--s) * .5) 22%);
  --accent-softer: hsl(var(--h) calc(var(--s) * .4) 16%);
  --good: hsl(150 45% 62%);
  --good-soft: hsl(150 30% 17%);
  --warn: hsl(40 85% 62%);
  --warn-soft: hsl(40 40% 17%);
  --bad: hsl(0 75% 68%);
  --bad-soft: hsl(0 40% 18%);
  --info: hsl(210 70% 70%);
  --info-soft: hsl(210 35% 18%);
  --overlay: hsl(0 0% 0% / .6);
  --shadow: 0 1px 2px #0004, 0 8px 24px -12px #0008;
  --shadow-lg: 0 24px 60px -20px #000c;
  color-scheme: dark;
}

:root[data-font="readable"] {
  --font-head: "Lexend", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, sans-serif;
}
:root[data-font="classic"] {
  --font-head: Georgia, "Times New Roman", serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-size="large"] { font-size: 17.5px; }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
  animation-duration: 0s !important; transition-duration: 0s !important;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 15.5px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background .3s var(--ease), color .3s var(--ease);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-strong); }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.7rem, 3.2vw, 2.35rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
small, .muted { color: var(--ink-2); }
.tiny { font-size: .8rem; color: var(--ink-2); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 6px;
}
.brand { display: flex; gap: 11px; align-items: center; padding: 2px 8px 14px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, var(--accent), hsl(calc(var(--h) + 25) var(--s) 66%));
  color: var(--accent-ink); display: grid; place-items: center;
  box-shadow: 0 6px 16px -6px var(--accent);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand b { font-family: var(--font-head); font-size: 1.12rem; display: block; line-height: 1.1; }
.brand span { font-size: .78rem; color: var(--ink-2); }
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); padding: 14px 12px 6px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 12px;
  color: var(--ink-2); text-decoration: none; font-size: .94rem; position: relative;
  transition: background .15s, color .15s;
}
.nav a svg { width: 18px; height: 18px; flex: none; color: var(--accent); opacity: .9; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav a.active::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent); }
.nav .badge-dot { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent-btn); color: var(--accent-ink); font-size: .7rem; font-weight: 700; display: grid; place-items: center; }
.sidebar-foot { margin-top: auto; padding-top: 14px; display: flex; gap: 6px; }
.side-art { margin-top: auto; }

.main { padding: 30px clamp(16px, 3.4vw, 44px) 60px; max-width: 1240px; width: 100%; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head p { color: var(--ink-2); margin-top: 6px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-hero { grid-template-columns: 1.35fr 1fr; }
.g-side { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt { margin-top: 16px; } .mt-s { margin-top: 8px; } .mt-l { margin-top: 28px; }
.grow { flex: 1; min-width: 0; }

/* ---------- Cards & tiles ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: 8px; }
.tile { border-radius: var(--radius); padding: 16px 18px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.tile .label { font-size: .82rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .value { font-family: var(--font-head); font-size: 1.75rem; font-weight: 600; margin-top: 6px; line-height: 1.1; }
.tile .sub { font-size: .8rem; color: var(--ink-2); margin-top: 6px; }
.tile.accent { background: var(--accent-soft); border-color: transparent; }
.tile.good { background: var(--good-soft); border-color: transparent; }
.tile.warn { background: var(--warn-soft); border-color: transparent; }
.tile.bad { background: var(--bad-soft); border-color: transparent; }
.tile.info { background: var(--info-soft); border-color: transparent; }
.tile.big .value { font-size: clamp(2.1rem, 4vw, 2.9rem); }
.hero-split { display: grid; grid-template-columns: 1.3fr 1fr; background: linear-gradient(120deg, var(--accent-soft), var(--accent-softer)); border: 0; }
.hero-split > div { padding: 22px 24px; }
.hero-split > div + div { border-left: 1px solid hsl(var(--h) 30% 50% / .14); }

.m { font-variant-numeric: tabular-nums; white-space: nowrap; }
.m small { font-size: .58em; color: inherit; opacity: .8; margin-left: 1px; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
body.privacy .m { filter: blur(7px); transition: filter .2s; }
body.privacy .m:hover { filter: none; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 550; font-size: .92rem;
  transition: transform .12s var(--ease), background .15s, border-color .15s, box-shadow .15s;
  white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--accent-btn); border-color: var(--accent-btn); color: var(--accent-ink); box-shadow: 0 6px 18px -8px var(--accent); }
.btn.primary:hover { background: var(--accent-btn); border-color: var(--accent-btn); filter: brightness(.92); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); background: var(--bad-soft); }
.btn.sm { padding: 6px 12px; font-size: .84rem; }
.btn.lg { padding: 13px 22px; font-size: 1rem; }
.btn.block { width: 100%; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 12px; }
.track-btn { width: 100%; padding: 11px 16px; margin: 2px 0 6px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: .78rem; color: var(--ink-3); font-weight: 400; }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px;
  padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px hsl(var(--h) var(--s) 60% / .18); }
.input.inline { padding: 6px 8px; border-radius: 9px; width: 110px; text-align: right; background: transparent; border-color: transparent; }
.input.inline:hover { border-color: var(--line-2); }
.input.inline:focus { background: var(--surface); }
.money-input { position: relative; }
.money-input .input { font-family: var(--font-head); font-size: 2rem; font-weight: 600; padding: 12px 14px; text-align: center; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: .92rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; border-radius: 999px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: .86rem; color: var(--ink-2); font-weight: 550; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px hsl(0 0% 0% / .12); }
.months { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.months button { border: 1px solid var(--line); background: var(--surface); padding: 5px 13px; border-radius: 999px; cursor: pointer; font-size: .84rem; color: var(--ink-2); }
.months button:hover { border-color: var(--accent); }
.months button.on { background: var(--accent-btn); border-color: var(--accent-btn); color: var(--accent-ink); font-weight: 600; }
.months .yr { font-family: var(--font-head); font-weight: 600; margin-right: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface);
  padding: 6px 12px; border-radius: 999px; font-size: .86rem; cursor: pointer; transition: all .12s;
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 7px; }
.cat-grid .chip { justify-content: flex-start; border-radius: 12px; padding: 9px 10px; font-size: .84rem; }
.cat-grid .chip .e { font-size: 1.05rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.pill.cat { background: var(--c-soft, var(--accent-soft)); color: var(--c-ink, var(--ink)); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.muted { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.acc { background: var(--accent-soft); color: var(--accent-strong); }
button.pill { border: 0; cursor: pointer; }

/* ---------- Lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .when { width: 74px; flex: none; font-size: .84rem; color: var(--ink-2); }
.li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .name small { display: block; font-size: .78rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.li .amt { font-weight: 650; text-align: right; }
.li.done .name, .li.done .amt { opacity: .5; text-decoration: line-through; }
.li .tools { display: flex; gap: 2px; opacity: .0; transition: opacity .15s; }
.li:hover .tools, .li:focus-within .tools { opacity: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--accent); }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); }
.emoji-badge { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--c-soft, var(--accent-soft)); font-size: 1.05rem; flex: none; }
.tick { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; transition: all .15s var(--ease); }
.tick:hover { border-color: var(--accent); }
.tick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tick.on.good { background: var(--good); border-color: var(--good); }
.tick svg { width: 14px; height: 14px; }
.day-group { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 16px 4px 4px; font-weight: 600; display: flex; justify-content: space-between; }

.empty { text-align: center; padding: 30px 16px; color: var(--ink-2); }
.empty .big { font-size: 2rem; margin-bottom: 6px; }
.empty p { max-width: 380px; margin: 0 auto 14px; }

/* ---------- Progress ---------- */
.bar { height: 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--accent)); width: 0; transition: width .6s var(--ease); }
.bar.over > i { background: var(--bad); }
.bar.thick { height: 14px; }
.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-label { position: absolute; text-align: center; font-weight: 700; font-size: .95rem; line-height: 1.1; }
.ring .ring-label small { display: block; font-weight: 500; font-size: .66rem; color: var(--ink-2); }
.ring circle { transition: stroke-dashoffset .8s var(--ease); }

/* ---------- Envelope table ---------- */
.env { width: 100%; border-collapse: collapse; }
.env th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 8px 6px; font-weight: 600; }
.env th.r, .env td.r { text-align: right; }
.env td { padding: 9px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
.env tr.group td { background: var(--surface-2); font-weight: 650; font-size: .86rem; padding: 9px 10px; }
.env .cat-cell { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.env .bar { min-width: 90px; }

/* ---------- Calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { font-size: .74rem; text-transform: uppercase; color: var(--ink-3); text-align: center; letter-spacing: .08em; padding-bottom: 4px; font-weight: 600; }
.cal .day {
  min-height: 92px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  padding: 7px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; transition: border-color .15s, transform .12s;
  min-width: 0; overflow: hidden;
}
.cal .day:hover { border-color: var(--accent); }
.cal .day.out { opacity: .38; }
.cal .day.today { border: 2px solid var(--accent); }
.cal .day.sel { background: var(--accent-softer); border-color: var(--accent); }
.cal .day.nospend { background-image: radial-gradient(circle at 92% 12%, var(--good-soft) 0 14px, transparent 15px); }
.cal .num { font-weight: 650; font-size: .88rem; display: flex; justify-content: space-between; }
.cal .ev { font-size: .7rem; border-radius: 6px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); }
.cal .ev.inc { background: var(--good-soft); color: var(--good); font-weight: 600; }
.cal .ev.fund { background: var(--info-soft); color: var(--info); }
.cal .ev.debt { background: var(--warn-soft); color: var(--warn); }
.cal .ev.paid { opacity: .55; text-decoration: line-through; }
.cal .spent { margin-top: auto; font-size: .72rem; color: var(--ink-2); }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); }
.cal-legend span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- Charts ---------- */
.chart { width: 100%; overflow: visible; }
.chart text { fill: var(--ink-2); font-size: 11px; font-family: var(--font-body); }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .bar-plan { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.chart .bar-act { fill: var(--accent); }
.chart .bar-act.over { fill: var(--bad); }
.chart .bar-in { fill: var(--good); }
.chart .bar-out { fill: var(--accent); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.alt { stroke: var(--ink-3); stroke-dasharray: 5 5; stroke-width: 2; }
.chart .area { fill: url(#areaGrad); }
.chart-scroll { overflow-x: auto; margin: 0 -6px; padding: 0 6px; overscroll-behavior-x: contain; }
.chart-scroll .chart { min-width: var(--minw, 0); }
.dragging { cursor: grabbing; user-select: none; }
.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); }
.fade-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px); mask-image: linear-gradient(90deg, transparent, #000 44px); }
.fade-l.fade-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent); }
.nav-sep { border: 0; border-top: 1px solid var(--line); margin: 8px 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.donut-legend { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
.donut-legend div { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
.donut-legend div b { margin-left: auto; font-weight: 600; }
.donut-legend div { white-space: nowrap; min-width: 0; }
.g-side .donut-wrap { flex-direction: column; align-items: stretch; }
.g-side .donut-wrap > .ring { align-self: center; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 9px; font-size: .78rem; z-index: 90; white-space: nowrap; opacity: 0; transition: opacity .12s; }

/* ---------- Today ---------- */
.today-hero { position: relative; overflow: hidden; padding: 28px; border: 0; background: radial-gradient(120% 140% at 0% 0%, var(--accent-soft), var(--surface) 70%); }
.today-hero .value { font-family: var(--font-head); font-size: clamp(2.8rem, 7vw, 4.4rem); font-weight: 650; line-height: 1; margin: 10px 0; }
.today-hero .sub { color: var(--ink-2); }
.mood { display: flex; gap: 8px; }
.mood button { font-size: 1.5rem; border: 1px solid var(--line); background: var(--surface); width: 48px; height: 48px; border-radius: 14px; cursor: pointer; transition: transform .15s var(--ease); }
.mood button:hover { transform: translateY(-2px) scale(1.06); }
.mood button.on { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.08); }
.streak { display: flex; align-items: center; gap: 12px; }
.streak .flame { font-size: 2rem; }
.week-dots { display: flex; gap: 6px; }
.week-dots span { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: .72rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); }
.week-dots span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.week-dots span.today { outline: 2px solid var(--accent); outline-offset: 2px; }
.nudge { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px dashed var(--line-2); }
.nudge .e { font-size: 1.3rem; }
.formula { font-size: .86rem; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
.formula .tot { border-top: 1px solid var(--line-2); padding-top: 6px; font-weight: 700; }

/* ---------- Funds / debts / goals ---------- */
.fund { display: flex; flex-direction: column; gap: 12px; }
.fund-top { display: flex; gap: 14px; align-items: center; }
.big-emoji { font-size: 1.8rem; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--c-soft, var(--accent-soft)); flex: none; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.kv span { display: block; font-size: .72rem; color: var(--ink-2); }
.kv b { font-weight: 650; font-size: .95rem; }
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line-2); }
.timeline .t { position: relative; padding: 8px 0; }
.timeline .t::before { content: attr(data-n); position: absolute; left: -22px; top: 9px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .62rem; display: grid; place-items: center; font-weight: 700; }
.steps { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.steps label { display: flex; gap: 9px; align-items: center; font-size: .9rem; cursor: pointer; }
.steps label.done span { text-decoration: line-through; color: var(--ink-3); }
.steps input { accent-color: var(--accent); width: 17px; height: 17px; }

/* ---------- Impulse pause ---------- */
.wish { display: flex; gap: 14px; align-items: center; }
.wish .timer { font-family: var(--font-head); font-weight: 600; font-size: 1.05rem; }
.wish.ready { background: linear-gradient(120deg, var(--accent-soft), var(--surface)); border-color: var(--accent); }

/* ---------- Badges ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { text-align: center; padding: 18px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.badge .e { font-size: 2.1rem; width: 66px; height: 66px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); }
.badge b { display: block; font-size: .9rem; }
.badge span { font-size: .76rem; color: var(--ink-2); }
.badge.locked { opacity: .5; }
.badge.locked .e { filter: grayscale(1); background: var(--surface-2); }
.ns-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.ns-grid button { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--ink-2); position: relative; }
.ns-grid button.on { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.ns-grid button.on::after { content: "✓"; position: absolute; top: 2px; right: 6px; font-size: .7rem; }
.ns-grid button.future { opacity: .35; cursor: default; }
.ns-grid button.today { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- Setup / guide ---------- */
.checklist { display: flex; flex-direction: column; gap: 8px; }
.checklist a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); transition: border-color .15s; }
.checklist a:hover { border-color: var(--accent); }
.checklist a.done { background: var(--good-soft); border-color: transparent; }
.checklist a.done b { text-decoration: line-through; opacity: .65; }
.checklist .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); font-size: .8rem; font-weight: 700; flex: none; }
.checklist a.done .n { background: var(--good); color: #fff; }
.guide h3 { margin-top: 18px; }
.guide p { color: var(--ink-2); margin-top: 4px; }
.kbd { display: inline-block; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: .78rem; background: var(--surface-2); font-family: ui-monospace, monospace; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; position: relative; padding: 0; }
.swatch.on { border-color: var(--ink); }
.swatch span { position: absolute; inset: 4px; border-radius: 10px; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.hue-range { -webkit-appearance: none; appearance: none; height: 12px; border-radius: 99px; background: linear-gradient(90deg, hsl(0 60% 60%), hsl(60 60% 60%), hsl(120 60% 60%), hsl(180 60% 60%), hsl(240 60% 60%), hsl(300 60% 60%), hsl(360 60% 60%)); }
.hue-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: var(--shadow); }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 14px; background: var(--warn-soft); color: var(--ink); margin-bottom: 18px; font-size: .9rem; flex-wrap: wrap; }
.banner.demo { background: linear-gradient(90deg, var(--accent), hsl(calc(var(--h) + 30) var(--s) 62%)); color: var(--accent-ink); }
.banner.demo .btn { background: var(--surface); color: var(--ink); border: 0; }

/* ---------- Modal, sheet, toast ---------- */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 60; padding: 16px; animation: fade .18s var(--ease); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.modal { background: var(--surface); border-radius: 24px; width: min(540px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--shadow-lg); padding: 24px; animation: pop .22s var(--ease); border: 1px solid var(--line); }
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: .9rem; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-lg); animation: up .25s var(--ease); }
.toast button { background: transparent; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; filter: brightness(1.25); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes up { from { opacity: 0; transform: translateY(12px); } }
.confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 100; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--r)); opacity: .9; } }
.celebrate { position: fixed; inset: 0; display: grid; place-items: center; z-index: 95; pointer-events: none; }
.celebrate div { background: var(--surface); padding: 22px 30px; border-radius: 22px; box-shadow: var(--shadow-lg); text-align: center; animation: pop .3s var(--ease); border: 1px solid var(--line); }
.celebrate .e { font-size: 3rem; }

.fab { display: none; }
.tabbar { display: none; }
.sheet-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sheet-nav a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border-radius: 16px; background: var(--surface-2); text-decoration: none; color: var(--ink); font-size: .82rem; text-align: center; }
.sheet-nav a svg { width: 22px; height: 22px; color: var(--accent); }
.sheet-nav a.active { background: var(--accent-soft); font-weight: 600; }

/* Focus mode hides anything not essential */
body.focus .nav .nf { display: none; }
body.focus .focus-hide { display: none !important; }


/* ---------- Premium components (shared by every edition) ---------- */
h1, h2, h3 { color: var(--head, var(--ink)); }
.flourish { display: inline-block; width: .62em; height: .62em; margin-left: .3em; vertical-align: .32em; }
.flourish.sm { width: 1.05rem; height: 1.05rem; vertical-align: -1px; }
.flourish svg { width: 100%; height: 100%; display: block; }
.brand-logo { width: 42px; height: 42px; flex: none; }
.brand-logo svg { width: 100%; height: 100%; display: block; }
.user-chip { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: var(--ink); font-weight: 600; transition: background .15s; }
.user-chip:hover { background: var(--surface-2); }
.user-chip svg { color: var(--ink-3); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; font-family: var(--font-head); font-size: 1.05rem; flex: none; }
.month-nav { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 3px; box-shadow: var(--shadow); }
.month-nav-label { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 600; min-width: 150px; justify-content: center; }
.month-nav-label svg { color: var(--accent-strong); }
.kpis { display: grid; grid-template-columns: 1.55fr 1fr 1fr 1fr; gap: 16px; }
.kpi { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .label { color: var(--ink-2); font-size: .9rem; font-weight: 600; margin-top: 6px; }
.kpi .value { font-family: var(--font-body); font-weight: 750; font-size: 1.75rem; letter-spacing: -.02em; line-height: 1.1; }
.kpi-hero { background: linear-gradient(135deg, var(--accent-softer), var(--surface) 75%); }
.kpi-hero .value { font-family: var(--font-head); font-size: clamp(2.4rem, 5vw, 3.4rem); margin: 6px 0 2px; color: var(--accent-strong); }
.kpi-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent-strong); }
.kpi-ic svg { width: 22px; height: 22px; }
.kpi-ic.good { background: var(--good-soft); color: var(--good); }
.kpi-ic.warn { background: var(--warn-soft); color: var(--warn); }
.kpi-ic.info { background: var(--good-soft); color: var(--good); }
.kpi-hero .row { gap: 14px; }
.kpi-hero .kpi-ic { width: 58px; height: 58px; }
.delta { font-size: .8rem; color: var(--ink-2); }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.ring-center { display: grid; place-items: center; padding: 6px 0; }
.big-pct { font-family: var(--font-head); font-size: 2.1rem; font-weight: 700; color: var(--head, var(--ink)); }
.ring .ring-label small { font-size: .74rem; margin-top: 2px; }
.good-nudge { background: var(--good-soft); border: 0; }
.link-sm { font-size: .86rem; font-weight: 600; color: var(--accent-strong); }
.goal-li { text-decoration: none; color: var(--ink); }
.goal-li svg { color: var(--ink-3); flex: none; }
.due-total { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--accent-softer); }
.due-total .value { font-family: var(--font-head); font-size: 1.9rem; font-weight: 700; color: var(--head, var(--ink)); }
.legend-list { display: flex; flex-direction: column; gap: 12px; }
.legend-list > div { display: flex; gap: 12px; align-items: flex-start; }
.legend-list .dot { width: 14px; height: 14px; margin-top: 3px; }
.legend-list b { display: block; font-size: .92rem; color: var(--head, var(--ink)); }
.legend-list span { font-size: .8rem; color: var(--ink-2); }
.cal .ev { display: flex; flex-direction: column; padding: 3px 7px; line-height: 1.2; }
.cal .ev b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.cal .ev i { font-style: normal; font-size: .66rem; opacity: .85; }
.search-box { position: relative; min-width: 200px; }
.search-box .input { padding-left: 40px; }
.search-box > span { position: absolute; left: 13px; top: 10px; color: var(--ink-3); }
.chip-scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip-scroll .chip { flex: none; }
.tx-head, .tx-row { display: grid; grid-template-columns: 82px minmax(0, 1.6fr) minmax(0, 1fr) 118px 30px; gap: 10px; align-items: center; }
.tx-head { border-bottom: 1px solid var(--line); padding: 4px 6px 8px; }
.tx-head button { background: none; border: 0; padding: 4px 0; font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.tx-head button.r { justify-content: flex-end; }
.tx-head button.on { color: var(--accent-strong); }
.tx-row { padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 10px; transition: background .12s; }
.tx-row:hover { background: var(--surface-2); }
.c-date { font-size: .86rem; color: var(--ink-2); }
.c-desc { display: flex; gap: 10px; align-items: center; min-width: 0; }
.c-desc b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-desc small { display: block; font-size: .76rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-cat { min-width: 0; overflow: hidden; }
.c-amt { text-align: right; font-weight: 700; }
.c-more { color: var(--ink-3); display: grid; place-items: center; }
.pct-col { width: 38px; text-align: right; margin-left: 4px; }
.savings-hero { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; position: relative; overflow: hidden; background: linear-gradient(110deg, var(--accent-softer), var(--surface) 70%); padding: 24px 28px; }
.sh-total { flex: 1 1 260px; min-width: 0; position: relative; z-index: 1; }
.sh-value { font-family: var(--font-head); font-size: clamp(2.4rem, 5vw, 3.4rem); font-weight: 700; color: var(--head, var(--ink)); line-height: 1.1; margin: 6px 0; }
.sh-msg { flex: 0 1 260px; position: relative; z-index: 1; border-left: 1px solid var(--line-2); padding-left: 24px; }
.serif-msg { font-family: var(--font-head); font-size: 1.25rem; color: var(--head, var(--ink)); line-height: 1.3; }
.sh-art { position: absolute; right: -20px; top: -10px; width: 230px; opacity: .9; pointer-events: none; transform: scaleX(-1); }
.sh-art svg, .side-art svg { width: 100%; height: auto; display: block; }
.savings-hero:has(.sh-art) .sh-msg { margin-right: 170px; }
.fund-amt { font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; color: var(--c-ink, var(--ink)); }
.next-box { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--c-soft, var(--accent-softer)); }
.next-box .e { font-size: 1.8rem; }
.next-box b { font-size: 1.2rem; color: var(--c-ink, var(--ink)); }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.fund .btn.ghost.sm { align-self: center; }
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-hero { grid-column: 1 / -1; }
  .savings-hero:has(.sh-art) .sh-msg { margin-right: 0; }

}
@media (max-width: 900px) {
  .page-head .actions { width: 100%; }
  .month-nav { flex: 1; justify-content: space-between; }
  .tx-head { display: none; }
  .tx-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "desc amt" "cat date"; row-gap: 4px; }
  .c-desc { grid-area: desc; } .c-amt { grid-area: amt; } .c-cat { grid-area: cat; padding-left: 44px; } .c-date { grid-area: date; text-align: right; font-size: .78rem; }
  .c-more { display: none; }

}
@media (max-width: 520px) {
  .kpi .value { font-size: 1.3rem; }
  .kpi-ic { width: 40px; height: 40px; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .main { padding: 18px 16px 110px; }
  .g2, .g3, .g-hero { grid-template-columns: minmax(0, 1fr); }
  .hero-split { grid-template-columns: minmax(0, 1fr); }

/* ---------- The Honey Nook: illustrated room + companion ---------- */
.nook { position: relative; border-radius: 28px; overflow: hidden; aspect-ratio: 3 / 1; min-height: 330px; isolation: isolate; margin-bottom: 16px;
  box-shadow: 0 2px 4px hsl(30 40% 30% / .06), 0 30px 60px -34px hsl(30 50% 25% / .55); border: 1px solid hsl(40 40% 86%); background: #f3e6cf; }
.nook-page { aspect-ratio: 2.6 / 1; min-height: 380px; }
.nook-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; z-index: -2; user-select: none;
  animation: nookDrift 26s ease-in-out infinite alternate; transform-origin: 62% 60%; }
@keyframes nookDrift { from { transform: scale(1.02); } to { transform: scale(1.06) translateX(-.6%); } }
.nook-light { position: absolute; inset: 0; z-index: -1; pointer-events: none; transition: background .6s; }
.nook[data-time="morning"] .nook-light { background: linear-gradient(180deg, hsl(200 80% 92% / .28), transparent 60%); }
.nook[data-time="golden"] .nook-light { background: radial-gradient(60% 90% at 62% 30%, hsl(38 100% 70% / .22), transparent 70%); }
.nook[data-time="night"] .nook-bg { filter: brightness(.48) saturate(.8) hue-rotate(-8deg); }
.nook[data-time="night"] .nook-light { background: radial-gradient(22% 46% at 84% 44%, hsl(40 100% 70% / .55), transparent 70%), radial-gradient(40% 60% at 62% 32%, hsl(230 60% 70% / .18), transparent 70%), linear-gradient(180deg, hsl(235 45% 18% / .25), hsl(30 40% 10% / .15)); mix-blend-mode: screen; }
/* glass card with today's number */
.nook-card { position: absolute; left: 26px; top: 50%; transform: translateY(-50%); width: min(440px, 44%); z-index: 3;
  background: hsl(45 60% 99% / .74); -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid hsl(0 0% 100% / .75); border-radius: 26px; padding: 22px 26px 20px; box-shadow: 0 24px 50px -28px hsl(30 50% 20% / .55); animation: nookIn .7s var(--ease) both; }
.nook-card .avail { font-family: var(--font-head); font-size: clamp(2.6rem, 5.4vw, 4.2rem); font-weight: 650; color: var(--head); line-height: 1; margin: 8px 0 10px; letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
.nook-card .avail .m small { font-size: .5em; }
.nook-card .eyebrow { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 650; }
.nook-card .guide { margin-top: 12px; padding-top: 12px; }
.nook-card .hero-actions { margin-top: 14px; }
:root[data-theme="dark"] .nook-card { background: hsl(150 12% 10% / .72); border-color: hsl(0 0% 100% / .12); }
@keyframes nookIn { from { opacity: 0; transform: translateY(calc(-50% + 14px)); } to { opacity: 1; transform: translateY(-50%); } }
/* companion */
.nook-friend { position: absolute; left: 61%; bottom: 8%; width: 10.5%; min-width: 96px; transform: translateX(-50%); z-index: 2; display: flex; flex-direction: column; align-items: center; }
.nook-page .nook-friend { width: 10%; }
.nook-pet { border: 0; background: none; padding: 0; cursor: pointer; width: 100%; transform-origin: 50% 100%; animation: nookBreathe 3.4s ease-in-out infinite; -webkit-tap-highlight-color: transparent; }
.nook-pet img { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 10px hsl(30 50% 25% / .18)); user-select: none; pointer-events: none; }
.nook-pet.pose-sleep { width: 128%; animation: nookSleep 4.6s ease-in-out infinite; }
.nook-pet:hover { animation-duration: 1.6s; }
.nook-pet:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 20px; }
.nook-pet.react { animation: nookHop .9s var(--ease) 2; }
@keyframes nookBreathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.03); } }
@keyframes nookSleep { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 1.045); } }
@keyframes nookHop { 0% { transform: translateY(0) scale(1, 1); } 18% { transform: translateY(0) scale(1.08, .92); } 45% { transform: translateY(-22%) scale(.96, 1.06); } 70% { transform: translateY(0) scale(1.06, .94); } 100% { transform: translateY(0) scale(1, 1); } }
.nook-shadow { width: 70%; height: 14px; margin-top: -10px; border-radius: 50%; background: radial-gradient(closest-side, hsl(30 40% 20% / .28), transparent); z-index: -1; }
.nook-bubble { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-30%); width: max-content; max-width: 250px; background: hsl(45 80% 99% / .95); color: var(--ink);
  border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-family: var(--font-head); font-style: italic; font-size: .98rem; line-height: 1.3; box-shadow: 0 14px 30px -18px hsl(30 50% 20% / .6); animation: nookBubble .6s .3s var(--ease) both; }
:root[data-theme="dark"] .nook-bubble { background: hsl(150 10% 14% / .95); color: var(--ink); }
@keyframes nookBubble { from { opacity: 0; transform: translateX(-30%) translateY(8px) scale(.96); } to { opacity: 1; transform: translateX(-30%) translateY(0) scale(1); } }
.nook-float { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); font-weight: 800; color: hsl(36 80% 34%); font-size: 1.2rem; pointer-events: none; animation: nookFloat 1.6s ease-out forwards; text-shadow: 0 2px 0 #fff; }
@keyframes nookFloat { from { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -60px); } }
.nook-drops { position: absolute; right: 16px; top: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; text-decoration: none; color: var(--ink);
  background: hsl(45 60% 99% / .7); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid hsl(0 0% 100% / .7); font-size: .9rem; }
.nook-drops span { color: var(--ink-2); font-size: .8rem; }
:root[data-theme="dark"] .nook-drops { background: hsl(150 12% 10% / .7); border-color: hsl(0 0% 100% / .12); }
/* atmosphere */
.nook-motes, .nook-snow { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.nook-motes i { position: absolute; left: var(--x); top: var(--y); width: 5px; height: 5px; border-radius: 50%; background: hsl(45 100% 80%); box-shadow: 0 0 10px 3px hsl(45 100% 75% / .6); opacity: 0; animation: nookMote var(--d) ease-in-out var(--w) infinite; }
@keyframes nookMote { 0%, 100% { opacity: 0; transform: translateY(0); } 50% { opacity: .85; transform: translateY(-16px); } }
.nook[data-time="night"] .nook-motes i { background: hsl(55 100% 85%); }
.nook-snow i { position: absolute; top: -10px; left: var(--x); width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .9; animation: nookSnow var(--d) linear var(--w) infinite; }
@keyframes nookSnow { to { transform: translate(24px, 360px); opacity: 0; } }
/* nook page pickers */
.nook-pets, .nook-rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.nook-pick, .nook-room { border: 1px solid var(--line); background: var(--surface-2); border-radius: 20px; padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--ink); text-align: center; transition: transform .15s, border-color .15s; }
.nook-pick:hover:not(:disabled), .nook-room:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
.nook-pick.on, .nook-room.on { border: 2px solid var(--accent); background: var(--accent-softer); }

.nook-pick span, .nook-room span { font-size: .78rem; color: var(--ink-2); }

.hero-quick .link-btn { display: inline-block; }
@media (prefers-reduced-motion: reduce) { .nook-bg, .nook-pet, .nook-motes i, .nook-snow i { animation: none !important; } }
:root[data-motion="off"] .nook-bg, :root[data-motion="off"] .nook-pet, :root[data-motion="off"] .nook-motes i, :root[data-motion="off"] .nook-snow i { animation: none !important; }
@media (max-width: 760px) {

  .nook-page .nook-bg, .nook-page .nook-light { height: 100%; bottom: 0; }

/* ==========================================================================

/** All ISO dates on which a recurring item lands between `from` and `to` (inclusive). */
function occurrences(freq, anchor, from, to, endDate) {
  if (!anchor) return [];
  const last = endDate && endDate < to ? endDate : to;
  const out = [];
  if (anchor > last) return out;
  if (freq === "once") {
    if (anchor >= from && anchor <= last) out.push(anchor);
    return out;
  }
  if (freq === "weekly" || freq === "biweekly") {
    const step = freq === "weekly" ? 7 : 14;
    let k = from > anchor ? Math.ceil(diffDays(anchor, from) / step) : 0;
    for (let d = addDays(anchor, k * step); d <= last; d = addDays(d, step)) out.push(d);
    return out;
  }
  if (freq === "semimonthly") {
    for (let mk = monthKey(from > anchor ? from : anchor); monthStart(mk) <= last; mk = addMonths(mk, 1)) {
      for (const d of [`${mk}-15`, monthEnd(mk)]) if (d >= from && d <= last && d >= anchor) out.push(d);
    }
    return out;
  }
  const step = freq === "quarterly" ? 3 : freq === "yearly" ? 12 : 1;
  const day = Number(anchor.slice(8, 10));
  let mk = monthKey(anchor);
  if (monthKey(from) > mk) {
    const gap = monthsBetween(mk, monthKey(from));
    mk = addMonths(mk, Math.floor(gap / step) * step);
  }
  for (; monthStart(mk) <= last; mk = addMonths(mk, step)) {
    const [y, m] = mk.split("-").map(Number);
    const d = `${mk}-${pad(Math.min(day, daysInMonth(y, m - 1)))}`;
    if (d >= from && d <= last && d >= anchor) out.push(d);
  }
  return out;
}
const monthsBetween = (a, b) => {
  const [y1, m1] = a.split("-").map(Number);
  const [y2, m2] = b.split("-").map(Number);
  return (y2 - y1) * 12 + (m2 - m1);
};
const perMonth = (amount, freq) =>

/** Everything planned between two dates: paychecks, bills, debt minimums and savings transfers. */
function scheduleIn(from, to) {
  const out = [];
  const push = (kind, ref, date, extra) => {
    const key = `${kind}:${ref.id}:${date}`;
    const o = { key, kind, refId: ref.id, date, name: ref.name, done: !!S.links[key], txId: S.links[key], ...extra };
    if (o.done) {
      const t = S.transactions.find((x) => x.id === o.txId);
      if (t) o.amount = Math.abs(t.amount);
    }
    out.push(o);
  };
  for (const inc of S.incomes) {
    for (const d of occurrences(inc.freq, inc.anchor, from, to, inc.endDate)) push("income", inc, d, { amount: inc.amount, emoji: inc.emoji || "💰" });
  }
  for (const b of S.bills) {
    const cat = catById(b.catId);
    for (const d of occurrences(b.freq, b.anchor, from, to, b.endDate))
      push("bill", b, d, { amount: b.amount, catId: b.catId, emoji: b.emoji || cat?.emoji || "🧾", autopay: b.autopay, isSub: b.isSub });
  }
  for (const debt of S.debts) {
    if (!(debt.minimum > 0)) continue;
    for (const d of occurrences("monthly", debt.anchor, from, to)) {
      const key = `debt:${debt.id}:${d}`;
      if (debt.balance <= 0 && !S.links[key]) continue;
      push("debt", debt, d, { amount: Math.min(debt.minimum, Math.max(debt.balance, 0)) || debt.minimum, emoji: "💳", name: `${debt.name} payment` });
    }
  }
  for (const f of S.funds) {
    if (!(f.monthly > 0)) continue;
    for (const d of occurrences(f.freq || "monthly", f.anchor, from, to)) {
      const key = `fund:${f.id}:${d}`;
      if (f.target > 0 && f.saved >= f.target && !S.links[key]) continue;
      push("fund", f, d, { amount: f.monthly, emoji: f.emoji || "🐷", name: `${f.name} transfer` });
    }
  }
  return out.sort(by((x) => x.date + (x.kind === "income" ? "0" : "1")));
}

  if (tx.effect.fundId) {
    const f = S.funds.find((x) => x.id === tx.effect.fundId);

  }
  if (tx.effect.envelopeId) {

    const e = S.envelopes.find((x) => x.id === tx.effect.envelopeId);
    if (e) e.amount = round2(Math.max(0, e.amount - sign * tx.amount));

}

  if (t.link) S.links[t.link] = t.id;
  if (t.date === todayISO()) S.checkins[t.date] = true;
  if (t.type === "expense" && !t.link && S.noSpend[t.date]) delete S.noSpend[t.date];
  return t;
}
function removeTx(id) {
  const i = S.transactions.findIndex((t) => t.id === id);
  if (i < 0) return null;
  const [t] = S.transactions.splice(i, 1);
  applyEffect(t, -1);
  for (const k in S.links) if (S.links[k] === id) delete S.links[k];
  return t;
}
function updateTx(id, patch) {
  const t = S.transactions.find((x) => x.id === id);
  if (!t) return;
  applyEffect(t, -1);
  Object.assign(t, patch, { amount: round2(patch.amount ?? t.amount) });
  applyEffect(t, +1);
}
/** Check or uncheck a scheduled occurrence; checking it records a real transaction. */
function toggleOccurrence(o) {
  if (S.links[o.key] === "skip") { delete S.links[o.key]; return false; }
  if (S.links[o.key]) {
    removeTx(S.links[o.key]);
    return false;
  }
  const base = { date: o.date, name: o.name, amount: o.amount, link: o.key };
  // Balance mode: anything dated before the last balance check is already in that balance.
  if (SKIN.balance && S.account.checkedOn && o.date < S.account.checkedOn) base.absorbed = true;
  if (o.kind === "income") addTx({ ...base, type: "income", catId: "income" });
  else if (o.kind === "bill") addTx({ ...base, type: "expense", catId: o.catId || "" });
  else if (o.kind === "debt") addTx({ ...base, type: "expense", catId: "debt", effect: { debtId: o.refId } });
  else if (o.kind === "fund") addTx({ ...base, type: "saving", catId: "savings", effect: { fundId: o.refId } });
  return true;
}

/* ---------- Budgets ---------- */
function budgetFor(cat, mk) {
  const o = S.budgets[mk];
  return o && o[cat.id] != null ? o[cat.id] : cat.budget || 0;
}
function catSpent(catId, mk) {
  return sum(txInMonth(mk).filter((t) => t.type === "expense" && t.catId === catId), (t) => t.amount);
}
/** Budget plus whatever was left over from previous months (when rollover is on). */
function catAvailable(cat, mk, depth = 0) {
  const base = budgetFor(cat, mk);
  if (!cat.rollover || depth > 11) return base;
  const prev = addMonths(mk, -1);
  if (prev < monthKey(S.createdAt)) return base;
  const carry = catAvailable(cat, prev, depth + 1) - catSpent(cat.id, prev);
  return base + carry;
}

/* ---------- Month summary & safe to spend ---------- */
function monthSummary(mk) {
  const from = monthStart(mk), to = monthEnd(mk);
  const txs = txInMonth(mk);
  const sched = scheduleIn(from, to);
  const income = sum(txs.filter((t) => t.type === "income"), (t) => t.amount);
  const spent = sum(txs.filter((t) => t.type === "expense"), (t) => t.amount);
  const saved = sum(txs.filter((t) => t.type === "saving"), (t) => t.amount);
  const pending = sched.filter((o) => !o.done);
  const expected = sum(pending.filter((o) => o.kind === "income"), (o) => o.amount);
  const billsDue = sum(pending.filter((o) => o.kind === "bill" || o.kind === "debt"), (o) => o.amount);
  const fundsDue = sum(pending.filter((o) => o.kind === "fund"), (o) => o.amount);
  const buffer = S.profile.buffer || 0;
  const safe = income + expected - spent - saved - billsDue - fundsDue - buffer;
  const planned = sum(S.categories, (c) => budgetFor(c, mk));
  return { mk, txs, sched, income, spent, saved, expected, billsDue, fundsDue, buffer, safe, planned, out: spent + saved };
}
function todaySummary() {
  const today = todayISO();
  if (SKIN.balance) {
    // Balance mode: the daily number comes from the real balance, until payday.
    const a = availableSummary(today);
    const m = monthSummary(monthKey(today));
    return { ...m, today, daysLeft: Math.max(1, a.days), todays: S.transactions.filter((t) => t.date === today), variableToday: a.spentToday, allowance: a.guide, leftToday: a.leftToday, safe: a.available };
  }
  const mk = monthKey(today);
  const m = monthSummary(mk);
  const d = fromISO(today);
  const daysLeft = daysInMonth(d.getFullYear(), d.getMonth()) - d.getDate() + 1;
  const todays = S.transactions.filter((t) => t.date === today);
  const variableToday = sum(todays.filter((t) => t.type === "expense" && !t.link), (t) => t.amount);
  const allowance = Math.max(0, (m.safe + variableToday) / daysLeft);
  return { ...m, today, daysLeft, todays, variableToday, allowance, leftToday: allowance - variableToday };
}

/* ---------- Paycheck windows ---------- */
function paycheckPlan(count = 4) {
  const today = todayISO();
  const all = scheduleIn(addDays(today, -45), addDays(today, 200));
  // Windows run from one main paycheck to the next; smaller income (side hustles,
  // benefits) that lands inside a window is added to it.
  const primary = [...S.incomes].sort((a, b) => perMonth(b.amount, b.freq) - perMonth(a.amount, a.freq))[0];
  if (!primary) return [];
  const paydays = all.filter((o) => o.kind === "income" && o.refId === primary.id);
  const windows = [];
  for (let i = 0; i < paydays.length - 1; i++) {
    const start = paydays[i].date, end = addDays(paydays[i + 1].date, -1);
    if (end < today) continue;
    const inWin = (o) => o.date >= start && o.date <= end;
    const items = all.filter((o) => o.kind === "income" && inWin(o));
    const due = all.filter((o) => o.kind !== "income" && inWin(o));
    const amount = sum(items, (o) => o.amount);
    const dueTotal = sum(due, (o) => o.amount);
    windows.push({ date: start, end, next: paydays[i + 1].date, amount, items, extra: items.filter((o) => o.refId !== primary.id), due, dueTotal, left: amount - dueTotal, days: diffDays(start, end) + 1 });
    if (windows.length >= count) break;
  }
  return windows;
}

/* ---------- Debt payoff simulation ---------- */
function simulateDebts(strategy = "avalanche", extra = 0) {
  const debts = S.debts.filter((d) => d.balance > 0).map((d) => ({ ...d, bal: d.balance, interest: 0, paidOffMonth: null }));
  if (!debts.length) return { months: 0, interest: 0, order: [], series: [0], ok: true };
  const order = [...debts].sort(strategy === "snowball" ? by((d) => d.bal) : (a, b) => b.apr - a.apr || a.bal - b.bal);
  const series = [sum(debts, (d) => d.bal)];
  let month = 0, totalInterest = 0;
  const budget = sum(debts, (d) => d.minimum) + extra;
  while (debts.some((d) => d.bal > 0.005) && month < 600) {
    month++;
    for (const d of debts) {
      if (d.bal <= 0) continue;
      const i = d.bal * (d.apr / 100 / 12);
      d.bal += i; d.interest += i; totalInterest += i;
    }
    let pool = budget;
    for (const d of debts) {
      if (d.bal <= 0) continue;
      const p = Math.min(d.minimum, d.bal, pool);
      d.bal -= p; pool -= p;
    }
    for (const d of order) {
      if (pool <= 0) break;
      if (d.bal <= 0) continue;
      const p = Math.min(d.bal, pool);
      d.bal -= p; pool -= p;
    }
    for (const d of debts) if (d.bal <= 0.005 && d.paidOffMonth == null) { d.bal = 0; d.paidOffMonth = month; }
    series.push(sum(debts, (d) => Math.max(0, d.bal)));
  }
  const ok = month < 600;
  return {
    ok, months: month, interest: totalInterest, series,
    order: order.map((d) => ({ id: d.id, name: d.name, month: d.paidOffMonth, interest: d.interest, apr: d.apr, start: d.balance })),
  };
}

/* ---------- Streaks ---------- */
function streak() {
  let n = 0;
  let d = todayISO();
  if (!S.checkins[d]) d = addDays(d, -1);
  while (S.checkins[d]) { n++; d = addDays(d, -1); }
  return n;
}

  { id: "goal_done", e: "🎉", name: "Dream achieved", desc: "Completed a goal" },
];
function earnedNow() {
  const got = new Set();
  if (S.transactions.length) got.add("first_track");
  if (setupSteps().every((s) => s.done)) got.add("setup");
  const st = streak();
  if (st >= 7) got.add("streak_7");
  if (st >= 30) got.add("streak_30");
  const ns = Object.keys(S.noSpend);
  if (ns.length) got.add("nospend_1");
  const perMonthNs = {};
  for (const d of ns) perMonthNs[monthKey(d)] = (perMonthNs[monthKey(d)] || 0) + 1;
  if (Object.values(perMonthNs).some((n) => n >= 5)) got.add("nospend_5");
  if (S.transactions.filter((t) => t.link && t.link.startsWith("bill:")).length >= 10) got.add("bills_10");
  for (const f of S.funds) {
    const p = f.target > 0 ? f.saved / f.target : 0;
    if (p >= 0.25) got.add("save_25");
    if (p >= 0.5) got.add("save_50");
    if (p >= 1) got.add("save_100");
  }
  if (S.debts.some((d) => d.balance <= 0 && d.original > 0)) got.add("debt_free");
  const thisMk = monthKey(todayISO());
  for (let i = 1; i <= 3; i++) {
    const mk = addMonths(thisMk, -i);
    if (mk < monthKey(S.createdAt)) break;
    const spentVar = sum(S.categories, (c) => catSpent(c.id, mk));
    const plan = sum(S.categories, (c) => budgetFor(c, mk));
    if (spentVar > 0 && spentVar <= plan) { got.add("under_budget"); break; }
  }
  if (S.wishlist.some((w) => w.decision === "skipped")) got.add("pause_1");
  if (S.skippedTotal >= 100) got.add("pause_100");
  if (S.goals.some((g) => g.status === "done")) got.add("goal_done");
  return got;
}
/** Award new badges; returns the newly earned ones. */
function checkBadges(silent = false) {
  const fresh = [];
  for (const id of earnedNow()) {
    if (!S.badges[id]) { S.badges[id] = todayISO(); fresh.push(BADGES.find((b) => b.id === id)); }
  }
  if (!silent && fresh.length) {
    const b = fresh[0];
    celebrate(b.e, `Badge unlocked: ${b.name}`, b.desc);
  }
  return fresh;
}

/** Paired bars: planned (outlined) vs actual (solid), one pair per item. */
function chartPlanVsActual(items) {
  if (!items.length) return empty("📊", "Nothing to chart yet", "Add a budget or track a few spends and this fills in.");
  const H = 262, top = 26, bottom = 74, left = 44, colW = 78;
  const W = Math.max(640, left + items.length * colW + 10);
  const max = niceMax(Math.max(...items.map((i) => Math.max(i.plan, i.actual)), 1));
  const y = (v) => top + (H - top - bottom) * (1 - v / max);
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    g += `<line class="grid-line" x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${shortMoney(v)}</text>`;
  }
  items.forEach((it, i) => {
    const x = left + i * colW + 12, bw = 19;
    const ya = y(it.actual) - 6;
    let yp = y(it.plan) - 6;
    if (Math.abs(yp - ya) < 13) yp = Math.min(yp, ya) - 12; // keep the two value labels from colliding
    const tip = `${it.label}: ${money(it.actual)} of ${money(it.plan)}`;
    g += `<g data-tip="${esc(tip)}"><rect class="bar-plan" x="${x}" y="${y(it.plan)}" width="${bw}" height="${Math.max(0, y(0) - y(it.plan))}" rx="5" style="fill:${it.soft};stroke:${it.color}"/>
      <rect class="bar-act ${it.actual > it.plan ? "over" : ""}" x="${x + bw + 3}" y="${y(it.actual)}" width="${bw}" height="${Math.max(0, y(0) - y(it.actual))}" rx="5" style="${it.actual > it.plan ? "" : `fill:${it.color}`}"/>
      <rect x="${x - 6}" y="${top}" width="${colW - 8}" height="${H - top}" fill="transparent"/></g>
      ${it.plan > 0 ? `<text x="${x + bw / 2}" y="${yp}" text-anchor="middle" style="font-size:10px">${shortMoney(it.plan)}</text>` : ""}
      <text x="${x + bw * 1.5 + 3}" y="${ya}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--ink)">${shortMoney(it.actual)}</text>
      <text x="${x + bw + 1}" y="${H - bottom + 22}" text-anchor="middle" style="font-size:16px">${esc(it.emoji || "")}</text>
      <text x="${x + bw + 1}" y="${H - bottom + 42}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${esc(trunc(it.short || it.label, 11))}</text>`;
  });
  return `<div class="chart-scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" style="--minw:${W}px" role="img" aria-label="Budget versus actual by category">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Planned</span><span><i style="background:var(--accent)"></i>Actual</span><span><i style="background:var(--bad)"></i>Over budget</span></div>`;
}
/** Budget vs. actual per month: soft budget bar, solid actual bar. Fits its card; scrolls on phones. */
function chartMonthly(rows, selected) {
  if (!rows.some((r) => r.plan > 0 || r.actual > 0)) return empty("📊", "Nothing to chart yet", "Add a budget or track a few spends and this fills in.");
  const H = 292, top = 14, bottom = 36, left = 70, colW = 66;
  const W = left + rows.length * colW + 6;
  // Axis tops that split into four round steps (…, 2,000 · 4,000 · 5,000 · 8,000 …).
  const hi = Math.max(...rows.map((r) => Math.max(r.plan, r.actual)), 1), e = Math.pow(10, Math.floor(Math.log10(hi)));
  const max = [1, 2, 4, 5, 8, 10].map((n) => n * e).find((v) => v >= hi);
  const y = (v) => top + (H - top - bottom) * (1 - v / max);
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    g += `<line class="grid-line" x1="${left - 6}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${left - 16}" y="${y(v) + 5}" text-anchor="end">${esc(moneyRound(v))}</text>`;
  }
  rows.forEach((r, i) => {
    const x = left + i * colW + 12, bw = 19;
    const tip = `${MONTHS[Number(r.mk.slice(5)) - 1]}: spent ${money(r.actual)} of ${money(r.plan)} budget`;
    g += `<g data-tip="${esc(tip)}" class="${r.mk === selected ? "sel" : ""}">
      <path class="mb-plan" d="${barPath(x, y(r.plan), bw, y(0) - y(r.plan))}"/>
      <path class="mb-act" d="${barPath(x + bw + 2, y(r.actual), bw, y(0) - y(r.actual))}"/>
      <rect x="${x - 10}" y="${top}" width="${colW - 6}" height="${H - top}" fill="transparent"/></g>
      <text class="mlabel ${r.mk === selected ? "sel" : ""}" x="${x + bw + 1}" y="${H - 8}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<div class="chart-scroll" data-drag-scroll data-scroll-end><svg class="chart mchart" viewBox="0 0 ${W} ${H}" style="--minw:${Math.max(520, W * 0.8)}px" role="img" aria-label="Budget versus actual by month">${g}</svg></div>`;
}
/** A bar with rounded top corners only. */
function barPath(x, yTop, w, h) {
  if (h <= 0) return "";
  const r = Math.min(4, w / 2, h);
  return `M${x} ${yTop + h}V${yTop + r}Q${x} ${yTop} ${x + r} ${yTop}H${x + w - r}Q${x + w} ${yTop} ${x + w} ${yTop + r}V${yTop + h}Z`;
}
/** Income vs money out, one pair per month. */
function chartInOut(rows) {
  const H = 240, top = 14, bottom = 30, left = 48;
  const colW = 56, W = Math.max(600, left + rows.length * colW + 10);
  const max = niceMax(Math.max(...rows.map((r) => Math.max(r.inc, r.out)), 1));
  const y = (v) => top + (H - top - bottom) * (1 - v / max);
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    g += `<line class="grid-line" x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${shortMoney(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const x = left + i * colW + 10, bw = 16;
    g += `<g data-tip="${esc(`${r.label}: in ${money(r.inc)} · out ${money(r.out)}`)}">
      <rect class="bar-in" x="${x}" y="${y(r.inc)}" width="${bw}" height="${Math.max(0, y(0) - y(r.inc))}" rx="4"/>
      <rect class="bar-out" x="${x + bw + 3}" y="${y(r.out)}" width="${bw}" height="${Math.max(0, y(0) - y(r.out))}" rx="4"/>
      <rect x="${x - 6}" y="${top}" width="${colW - 6}" height="${H - top}" fill="transparent"/></g>
      <text x="${x + bw}" y="${H - 10}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<div class="chart-scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" style="--minw:${W}px" role="img" aria-label="Income versus spending per month">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--good)"></i>Money in</span><span><i style="background:var(--accent)"></i>Money out (spent + saved)</span></div>`;
}
/** Simple line chart; `series` = [{values, cls}] sharing x positions; labels at a few ticks. */
function chartLine(series, labelFor, { height = 220, width = 640, aria = "Line chart", points = false } = {}) {
  const n = Math.max(...series.map((s) => s.values.length));
  if (n < 2) return "";
  const W = width, H = height, top = 12, bottom = 28, left = 52, right = 10;
  const max = niceMax(Math.max(...series.flatMap((s) => s.values), 1));
  const x = (i) => left + ((W - left - right) * i) / (n - 1);
  const y = (v) => top + (H - top - bottom) * (1 - v / max);
  let g = `<defs><linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    g += `<line class="grid-line" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${shortMoney(v)}</text>`;
  }
  const ticks = Math.min(width < 500 ? 4 : 6, n);
  for (let k = 0; k < ticks; k++) {
    const i = Math.round(((n - 1) * k) / (ticks - 1));
    g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(labelFor(i))}</text>`;
  }
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    if (si === 0) g += `<path class="area" d="M${x(0)},${y(0)} L${pts.join(" L")} L${x(s.values.length - 1)},${y(0)} Z"/>`;
    g += `<polyline class="line ${s.cls || ""}" points="${pts.join(" ")}"/>`;
    if (points && si === 0) s.values.forEach((v, i) => {
      g += `<circle cx="${x(i)}" cy="${y(v)}" r="5" class="pt"/><text x="${x(i)}" y="${y(v) - 12}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${shortMoney(v)}</text>`;
    });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
}
function donut(segments, size = 170) {
  const total = sum(segments, (s) => s.value);
  const stroke = 24, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let off = 0, arcs = "";
  for (const s of segments) {
    const len = total > 0 ? (s.value / total) * c : 0;
    arcs += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-off}" data-tip="${esc(`${s.label}: ${money(s.value)} (${pct(s.value, total)}%)`)}"/>`;
    off += len;
  }
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>${arcs}</svg>
    <div class="ring-label" style="font-family:var(--font-head);font-size:1.15rem">${moneyHTML(total, { noCents: true })}<small>total</small></div></div>`;
}
function sparkline(values, w = 120, h = 34) {
  if (values.length < 2) return "";
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const pts = values.map((v, i) => `${((w * i) / (values.length - 1)).toFixed(1)},${(h - 3 - ((h - 6) * (v - min)) / (max - min || 1)).toFixed(1)}`);
  return `<svg width="${w}" height="${h}" class="chart" aria-hidden="true"><polyline class="line" points="${pts.join(" ")}"/></svg>`;
}

/* ---------- Tooltip ---------- */
let tipEl = null;
document.addEventListener("pointermove", (e) => {
  const t = e.target.closest?.("[data-tip]");
  if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
  if (!t) { tipEl.style.opacity = 0; return; }
  tipEl.textContent = t.getAttribute("data-tip");
  tipEl.style.opacity = 1;
  const x = Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
  tipEl.style.left = x + "px";
  tipEl.style.top = e.clientY - 38 + "px";
});

/* ---------- Toasts ---------- */
function toast(msg, opts = {}) {
  let wrap = $(".toasts");
  if (!wrap) { wrap = document.createElement("div"); wrap.className = "toasts"; wrap.setAttribute("role", "status"); document.body.appendChild(wrap); }
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? `<button>Undo</button>` : ""}`;
  if (opts.undo) el.querySelector("button").onclick = () => { opts.undo(); el.remove(); };
  wrap.appendChild(el);
  setTimeout(() => el.remove(), opts.undo ? 6000 : 3200);
}

/* ---------- Confetti & celebrations ---------- */
function confetti(n = 90) {
  if (!S.settings.celebrate || S.settings.motion === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const hues = [S.settings.h, S.settings.h + 30, 45, 150, 200];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = `hsl(${hues[i % hues.length]} 75% 62%)`;
    c.style.setProperty("--dx", (Math.random() - 0.5) * 220 + "px");
    c.style.setProperty("--r", Math.random() * 900 - 450 + "deg");
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
    c.style.animationDelay = Math.random() * 0.25 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3700);
  }
}
function celebrate(emoji, title, sub = "") {
  if (!S.settings.celebrate) { toast(title); return; }
  confetti();
  const el = document.createElement("div");
  el.className = "celebrate";
  el.innerHTML = `<div><div class="e">${esc(emoji)}</div><h2 class="mt-s">${esc(title)}</h2>${sub ? `<p class="muted mt-s">${esc(sub)}</p>` : ""}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ---------- Modal ---------- */
let modalCleanup = null;
function openModal({ title, body, foot = "", wide = false, onSubmit, onMount }) {
  closeModal();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<form class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
      <div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="btn ghost icon-btn" data-close aria-label="Close">${icon("x")}</button></div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ""}
    </form>`;
  document.body.appendChild(ov);
  const form = ov.querySelector("form");
  const prevFocus = document.activeElement;
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) closeModal(); });
  ov.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!onSubmit) return closeModal();
    const data = Object.fromEntries(new FormData(form).entries());
    form.querySelectorAll("input[type=checkbox][name]").forEach((c) => (data[c.name] = c.checked));
    if (onSubmit(data, form) !== false) closeModal();
  });
  modalCleanup = () => prevFocus?.focus?.();
  onMount?.(form);
  const first = form.querySelector("[autofocus]") || form.querySelector(".modal-body input, .modal-body select, .modal-body textarea");
  setTimeout(() => first?.focus(), 30);
  return form;
}
function closeModal() {
  const ov = $(".overlay");
  if (ov) ov.remove();
  if (modalCleanup) { const f = modalCleanup; modalCleanup = null; f(); }
}
function confirmBox(title, text, okLabel, onOk, danger = true) {
  openModal({
    title,
    body: `<p class="muted">${esc(text)}</p>`,
    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger" : "primary"}">${esc(okLabel)}</button>`,
    onSubmit: () => { onOk(); },
  });
}

const moneyInp = (name, value = "", attrs = "") => inp(name, value === "" || value == null ? "" : round2(value), `type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" ${attrs}`);

const chk = (name, on, label) => `<label class="check"><input type="checkbox" name="${name}" ${on ? "checked" : ""}> ${label}</label>`;

function download(filename, text, type = "application/json") {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function pickFile(accept, cb) {
  const i = document.createElement("input");
  i.type = "file";
  i.accept = accept;
  i.onchange = () => {
    const f = i.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => cb(String(r.result), f);
    r.readAsText(f);
  };
  i.click();
}

function frequentSpends() {

    if (t.type !== "expense" || t.link || t.date < since) continue;
    const k = `${(t.name || "").toLowerCase()}|${t.catId}`;

  return {
    income: sum(txs.filter((t) => t.type === "income"), (t) => t.amount),
    spent: sum(txs.filter((t) => t.type === "expense"), (t) => t.amount),

  const cls = p === 0 ? "" : (p > 0) === upIsGood ? "up" : "down";
  return `<span class="delta ${cls}">${p > 0 ? "+" : ""}${p}% vs ${MONTHS_S[Number(prevMk.slice(5)) - 1]}</span>`;
}
function homeChartItems(mk) {

    color: mono ? "var(--accent)" : catColor(c), soft: mono ? "var(--accent-soft)" : isDark() ? `hsl(${c.hue} 30% 22%)` : `hsl(${c.hue} 70% 92%)` });
  const live = rows.filter((r) => r.plan > 0 || r.spent > 0).sort((a, b) => Math.max(b.plan, b.spent) - Math.max(a.plan, a.spent));

function formulaHTML(m) {
  const row = (label, v, sign) => `<span>${label}</span><b class="m">${sign}${money(Math.abs(v))}</b>`;
  return `<div class="formula">
    ${row("Money received", m.income, "+ ")}
    ${row("Paychecks still expected", m.expected, "+ ")}
    ${row("Spent so far", m.spent, "− ")}
    ${row("Moved to savings", m.saved, m.saved < 0 ? "+ " : "− ")}
    ${row("Bills & debt still due", m.billsDue, "− ")}
    ${row("Savings transfers planned", m.fundsDue, "− ")}
    ${m.buffer ? row("Safety buffer", m.buffer, "− ") : ""}
    <span class="tot">Safe to spend</span><b class="tot m ${m.safe < 0 ? "neg" : "pos"}">${money(m.safe)}</b>
  </div>`;
}
function spendingDonut(txs) {
  const totals = {};
  for (const t of txs.filter((t) => t.type === "expense")) totals[t.catId] = (totals[t.catId] || 0) + t.amount;
  const rows = Object.entries(totals).map(([id, v]) => ({ cat: catById(id), value: v })).sort((a, b) => b.value - a.value);
  if (!rows.length) return empty("🍃", "No spending yet", "Once you track a spend, you'll see where your money goes.");
  const top = rows.slice(0, 6), rest = rows.slice(6);
  const segs = top.map((r) => ({ value: r.value, color: catColor(r.cat), label: r.cat?.name || "Other", emoji: r.cat?.emoji || "•" }));
  if (rest.length) segs.push({ value: sum(rest, (r) => r.value), color: "var(--ink-3)", label: "Everything else", emoji: "…" });
  const total = sum(segs, (x) => x.value);
  return `<div class="donut-wrap">${donut(segs)}<div class="donut-legend">${segs.map((s) => `<div><i class="dot" style="background:${s.color}"></i>${esc(s.emoji)} ${esc(s.label)}<b>${moneyHTML(s.value)}</b><span class="tiny pct-col">${pct(s.value, total)}%</span></div>`).join("")}</div></div>`;
}
