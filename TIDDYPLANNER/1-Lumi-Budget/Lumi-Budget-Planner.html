function tinyTasks(t) {
  const out = [];
  const nudge = (e, html, action = "") => `<div class="nudge"><span class="e">${e}</span><div class="grow">${html}</div>${action}</div>`;
  const overdue = t.sched.filter((o) => !o.done && o.date < t.today);
  for (const o of overdue.slice(0, 3)) {
    const q = o.kind === "income" ? `Did your <b>${esc(o.name)}</b> arrive on ${fmtDay(o.date)}?` : `Did <b>${esc(o.name)}</b> get paid on ${fmtDay(o.date)}?`;
    out.push(nudge(o.kind === "income" ? "💸" : "🧾", `${q} <span class="tiny">${money(o.amount)}</span>`, `<button class="btn sm" data-action="toggle-occ" data-key="${esc(o.key)}">Yes, check it off</button>`));
  }
  const ready = S.wishlist.filter((w) => !w.decision && Date.now() >= w.readyAt);
  if (ready.length) out.push(nudge("⏸️", `<b>${esc(ready[0].name)}</b> finished its pause. Still want it?`, `<a class="btn sm" href="#impulse">Decide</a>`));
  const steps = setupSteps();
  const done = steps.filter((s) => s.done).length;
  if (done < steps.length) out.push(nudge("🧭", `Finish setting up — <b>${done} of ${steps.length}</b> done. Next: ${esc(steps.find((s) => !s.done).label)}.`, `<a class="btn sm" href="#setup">Continue</a>`));
  const lb = S.settings.lastBackup;
  if (!IS_DEMO && S.transactions.length > 15 && (!lb || diffDays(lb, t.today) > 30)) out.push(nudge("💾", "Your data lives in this browser. Save a backup file — it takes 2 seconds.", `<button class="btn sm" data-action="export-json">Back up</button>`));
  return out.slice(0, 5);
}

/* ---------- Calendar ---------- */
function viewCalendar() {
  const mk = ui.calMonth;
  const ws = S.profile.weekStart || 0;
  const first = fromISO(monthStart(mk));
  const lead = (first.getDay() - ws + 7) % 7;
  const start = addDays(monthStart(mk), -lead);
  const cells = Math.ceil((lead + daysInMonth(first.getFullYear(), first.getMonth())) / 7) * 7;
  const end = addDays(start, cells - 1);
  const sched = scheduleIn(start, end);
  const txs = txInRange(start, end);
  const today = todayISO();
  let grid = "";
  for (let i = 0; i < 7; i++) grid += `<div class="dow">${DOW[(i + ws) % 7]}</div>`;
  for (let i = 0; i < cells; i++) {
    const d = addDays(start, i);
    const ev = sched.filter((o) => o.date === d);
    const spent = sum(txs.filter((t) => t.date === d && t.type === "expense" && !t.link), (t) => t.amount);
    grid += `<button class="day ${monthKey(d) !== mk ? "out" : ""} ${d === today ? "today" : ""} ${d === ui.calSel ? "sel" : ""} ${S.noSpend[d] ? "nospend" : ""}" data-action="cal-day" data-date="${d}" aria-label="${fmtLong(d)}">
      <span class="num"><span>${Number(d.slice(8))}</span>${S.noSpend[d] ? "<span title='No-spend day'>🧘</span>" : ""}</span>
      ${ev.slice(0, 3).map((o) => `<span class="ev ${o.kind === "income" ? "inc" : o.kind} ${o.done ? "paid" : ""}" title="${esc(`${o.name} · ${money(o.amount)}`)}"><b>${esc(o.emoji || "")} ${esc(o.name)}</b><i class="m">${money(o.amount)}</i></span>`).join("")}
      ${ev.length > 3 ? `<span class="tiny">+${ev.length - 3} more</span>` : ""}
      ${spent ? `<span class="spent m">−${money(spent)}</span>` : ""}
    </button>`;
  }
  const sel = ui.calSel;
  const selEv = scheduleIn(sel, sel);
  const selTx = S.transactions.filter((t) => t.date === sel);
  const from = mk === monthKey(today) ? today : monthStart(mk);
  const due = scheduleIn(from, monthEnd(mk)).filter((o) => o.kind !== "income" && !o.done);
  const fl = SKIN.flourish ? `<span class="flourish sm">${SKIN.flourish}</span>` : "";
  return `
  ${pageHead("Calendar", `${monthLabel(mk)} · tap any day to see what's due, check things off, or add something.`, `<button class="btn" data-action="cal-month" data-mk="${addMonths(mk, -1)}" aria-label="Previous month">${icon("chevL")}</button><button class="btn" data-action="cal-month" data-mk="${monthKey(today)}">Today</button><button class="btn" data-action="cal-month" data-mk="${addMonths(mk, 1)}" aria-label="Next month">${icon("chevR")}</button><button class="btn primary" data-action="add-bill" data-date="${sel}">${icon("plus")}Add a reminder</button>`)}
  <div class="grid g-side">
    <div class="card">
      <div class="card-head"><h2>${monthLabel(mk)}</h2>
        <div class="cal-legend"><span><i class="dot good"></i>Payday</span><span><i class="dot"></i>Bill</span><span><i class="dot warn"></i>Debt</span><span><i class="dot info"></i>Savings</span></div></div>
      <div class="cal">${grid}</div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-head"><h3>${fmtLong(sel)}</h3></div>
        ${selEv.length ? `<div class="list">${selEv.map((o) => schedRow(o, { showDate: false })).join("")}</div>` : `<p class="tiny">Nothing scheduled.</p>`}
        ${selTx.filter((t) => !t.link).length ? `<div class="day-group">Tracked</div><div class="list">${selTx.filter((t) => !t.link).map((t) => txRow(t)).join("")}</div>` : ""}
        <div class="row wrap mt">
          <button class="btn sm primary" data-action="quick-add" data-date="${sel}">${icon("plus")}Spend</button>
          <button class="btn sm" data-action="add-bill" data-date="${sel}">${icon("receipt")}Bill</button>
          <button class="btn sm" data-action="add-income" data-date="${sel}">${icon("wallet")}Payday</button>
          ${sel <= today ? `<button class="btn sm" data-action="toggle-nospend" data-date="${sel}">${S.noSpend[sel] ? "✓ No-spend" : "🧘 No-spend"}</button>` : ""}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Coming up${fl}</h2></div>
        ${due.length ? `<div class="list">${due.slice(0, 6).map((o) => `<div class="li"><span class="emoji-badge" style="${o.kind === "fund" ? catVars(150) : ""}">${esc(o.emoji || "🧾")}</span><div class="name"><b>${esc(o.name)}</b><small>${fmtLong(o.date)}</small></div><div class="amt">${moneyHTML(o.amount)}</div></div>`).join("")}</div>${due.length > 6 ? `<p class="tiny mt-s">+ ${due.length - 6} more this month</p>` : ""}` : `<p class="tiny">Everything for ${monthName(mk)} is checked off. 🎉</p>`}
        <div class="due-total mt"><div><div class="tiny">Total still to pay in ${monthName(mk)}</div><div class="value m">${money(sum(due, (o) => o.amount))}</div></div><span class="kpi-ic acc">${icon("receipt")}</span></div>

          <div><span>🧘</span><div><b>No-spend day</b><span>Nothing spent beyond plans</span></div></div>
        </div>
      </div>
    </div>
  </div>`;
}

function paycheckCard(w, today) {
  const isNow = w.date <= today && w.end >= today;

    <div class="card-head">
      <div><div class="row wrap">${isNow ? `<span class="pill acc">Current paycheck</span>` : w.date > today ? `<span class="pill muted">Upcoming</span>` : ""}<span class="tiny">${fmtLong(w.date)} → ${fmtDay(w.end)} · ${plural(w.days, "day")}</span></div>
      <h2 class="mt-s">${esc(w.items[0].name)} ${moneyHTML(w.items[0].amount)}</h2>
      ${w.extra.length ? `<div class="tiny mt-s">+ ${w.extra.map((o) => `${esc(o.name)} ${money(o.amount)} (${fmtDay(o.date)})`).join(", ")}</div>` : ""}</div>
      <div style="text-align:right"><div class="tiny">Left after bills</div><div style="font-family:var(--font-head);font-size:1.6rem;font-weight:600" class="${w.left < 0 ? "neg" : "pos"}">${moneyHTML(w.left)}</div><div class="tiny">≈ ${money(Math.max(0, perDay))}/day</div></div>
    </div>
    ${progressBar(w.dueTotal, w.amount, "", true)}
    <div class="tiny mt-s">${money(w.dueTotal)} of this paycheck is already spoken for (${pct(w.dueTotal, w.amount)}%).</div>
    ${w.left < 0 ? `<div class="banner mt" style="margin-bottom:0"><span>⚠️ This paycheck is short by <b>${money(-w.left)}</b>. Try moving a bill's due date, using your buffer, or pulling from savings.</span></div>` : ""}
    ${w.due.length ? `<div class="list mt">${w.due.map((o) => schedRow(o)).join("")}</div>` : `<p class="tiny mt">No bills due from this paycheck — it's all yours to plan.</p>`}
  </div>`;
}

/* ---------- Transactions ---------- */
function viewTransactions() {
  const mk = ui.month;
  const txs = txInMonth(mk);
  const out = txs.filter((t) => t.type === "expense");
  const catOut = out.filter((t) => S.categories.some((c) => c.id === t.catId));
  const spentCats = sum(catOut, (t) => t.amount);
  const debtPaid = sum(out.filter((t) => t.catId === "debt"), (t) => t.amount);
  const budget = sum(S.categories, (c) => catAvailable(c, mk));
  const left = budget - spentCats;
  const used = {};
  for (const t of out) used[t.catId] = (used[t.catId] || 0) + t.amount;
  const chips = Object.entries(used).sort((a, b) => b[1] - a[1]).map(([id]) => catById(id)).filter(Boolean);
  return `
  ${pageHead("My spending", "A clear view of every dollar, month by month.", `
    <button class="btn" data-action="import-csv">${icon("upload")}Import</button>
    <button class="btn" data-action="export-csv">${icon("download")}Export</button>
    <button class="btn primary" data-action="quick-add">${icon("plus")}Add</button>`, { month: mk })}
  ${monthsBar(mk)}
  <div class="grid g3">
    <div class="card kpi"><span class="kpi-ic warn">${icon("wallet")}</span><div class="label">Spent</div><div class="value">${moneyHTML(spentCats)}</div><div class="tiny">${pct(spentCats, budget)}% of budget${debtPaid ? ` · + ${money(debtPaid)} debt payments` : ""}</div><div class="mt-s">${progressBar(spentCats, budget, catVars(14))}</div></div>
    <div class="card kpi"><span class="kpi-ic acc">${icon("target")}</span><div class="label">Budget</div><div class="value">${moneyHTML(budget)}</div><div class="tiny">for ${monthName(mk)} · ${plural(out.length, "spend")}</div><div class="mt-s">${progressBar(0, 1)}</div></div>
    <div class="card kpi"><span class="kpi-ic good">${icon("leaf")}</span><div class="label">Left</div><div class="value ${left < 0 ? "neg" : ""}">${moneyHTML(left)}</div><div class="tiny">${budget > 0 ? `${pct(Math.max(0, left), budget)}% left` : "Set a budget to see this"}</div><div class="mt-s">${progressBar(Math.max(0, left), budget, catVars(150))}</div></div>
  </div>
  <div class="grid g-side mt">
    <div class="card">
      <div class="row wrap" style="margin-bottom:12px">
        <div class="grow search-box"><input class="input" id="tx-search" placeholder="Search a spend (shop, category, note…)  /" value="${esc(ui.txQuery)}"><span>${icon("search", 18)}</span></div>
        <div class="seg">${[["all", "All"], ["expense", "Spending"], ["income", "Income"], ["saving", "Savings"]].map(([v, l]) => `<button class="${ui.txType === v ? "on" : ""}" data-action="tx-type" data-v="${v}">${l}</button>`).join("")}</div>
      </div>
      ${chips.length ? `<div class="chips chip-scroll" style="margin-bottom:10px"><button class="chip ${!ui.txCat ? "on" : ""}" data-action="tx-cat" data-v="">All</button>${chips.map((c) => `<button class="chip ${ui.txCat === c.id ? "on" : ""}" data-action="tx-cat" data-v="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("")}</div>` : ""}
      <div class="tx-head">${[["date", "Date"], ["name", "Description"], ["cat", "Category"], ["amount", "Amount"]].map(([k, l]) => `<button class="${k === "amount" ? "r" : ""} ${ui.txSort.k === k ? "on" : ""}" data-action="tx-sort" data-k="${k}">${l} ${icon(ui.txSort.k === k ? (ui.txSort.dir < 0 ? "chevDown" : "arrowUp") : "sort", 13)}</button>`).join("")}<span></span></div>
      <div id="tx-list">${txListHTML()}</div>
    </div>
    <div class="card"><div class="card-head"><h2>Spending by category</h2></div>${spendingDonut(txs)}</div>
  </div>`;
}
function txListHTML() {
  const q = ui.txQuery.trim().toLowerCase();
  const { k, dir } = ui.txSort;
  const keyOf = { date: (t) => t.date + String(t.createdAt).padStart(15, "0"), name: (t) => (t.name || "").toLowerCase(), cat: (t) => (catById(t.catId)?.name || "~").toLowerCase(), amount: (t) => (t.type === "expense" ? 1 : -1) * t.amount };
  const txs = txInMonth(ui.month)
    .filter((t) => ui.txType === "all" || t.type === ui.txType)
    .filter((t) => !ui.txCat || t.catId === ui.txCat)
    .filter((t) => !q || `${t.name} ${t.note} ${catById(t.catId)?.name || ""}`.toLowerCase().includes(q))
    .sort((a, b) => { const x = keyOf[k](a), y = keyOf[k](b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  if (!txs.length) return empty("🔎", q || ui.txCat || ui.txType !== "all" ? "No matches" : "Nothing tracked this month", "Track a spend with the + button, or press N anywhere.");
  return `<div class="tx-table">${txs.map((t) => {
    const cat = catById(t.catId);
    const isIn = t.type === "income" || (t.type === "saving" && t.amount < 0);
    const amount = Math.abs(t.amount);
    return `<div class="tx-row" data-action="edit-tx" data-id="${t.id}" role="button" tabindex="0">
      <span class="c-date">${fmtDay(t.date)}</span>
      <span class="c-desc"><span class="emoji-badge" style="${catStyle(cat)}">${esc(cat?.emoji || "•")}</span><span class="grow" style="min-width:0"><b>${esc(t.name || cat?.name || "Untitled")}</b><small>${t.note ? esc(t.note) : t.link ? "Scheduled" : esc(cat?.name || "")}</small></span></span>
      <span class="c-cat">${catPill(cat)}</span>
      <span class="c-amt ${isIn ? "pos" : ""}">${isIn ? "+" : "−"}${moneyHTML(amount)}</span>
      <span class="c-more" aria-hidden="true">${icon("dots", 18)}</span>
    </div>`;
  }).join("")}</div>`;
}

/* ---------- Budget (envelopes) ---------- */
function viewBudget() {
  const mk = ui.month;
  const rows = S.categories.map((c) => ({ c, plan: catAvailable(c, mk), base: budgetFor(c, mk), spent: catSpent(c.id, mk) }));
  const planned = sum(rows, (r) => r.plan), spent = sum(rows, (r) => r.spent);
  const m = monthSummary(mk);
  const inc = m.income + m.expected;
  const groupSpend = (g) => sum(rows.filter((r) => r.c.group === g), (r) => r.spent);
  const savingsPart = Math.max(0, m.saved) + m.fundsDue + sum(m.txs.filter((t) => t.catId === "debt"), (t) => t.amount);
  const split = [["Needs", groupSpend("needs"), 50], ["Wants", groupSpend("wants"), 30], ["Savings & debt", savingsPart, 20]];
  let table = "";
  for (const g of ["needs", "wants"]) {
    const gr = rows.filter((r) => r.c.group === g);
    if (!gr.length) continue;
    table += `<tr class="group"><td colspan="2">${GROUPS[g].label} <span class="tiny">· ${GROUPS[g].hint}</span></td><td class="r m">${money(sum(gr, (r) => r.plan))}</td><td class="r m hide-m">${money(sum(gr, (r) => r.spent))}</td><td class="r m">${money(sum(gr, (r) => r.plan - r.spent))}</td></tr>`;
    for (const r of gr) {
      const left = r.plan - r.spent;
      table += `<tr>
        <td><div class="cat-cell"><span class="emoji-badge" style="${catStyle(r.c)}">${esc(r.c.emoji)}</span><button class="btn ghost sm" style="padding:4px 6px" data-action="edit-cat" data-id="${r.c.id}">${esc(r.c.name)}</button>${r.c.rollover ? `<span class="pill muted" title="Unspent money rolls into next month">↻</span>` : ""}</div></td>
        <td style="width:30%">${progressBar(r.spent, r.plan, catStyle(r.c))}</td>
        <td class="r"><input class="input inline m" type="number" step="1" min="0" value="${round2(r.base)}" data-input="cat-budget" data-id="${r.c.id}" aria-label="Budget for ${esc(r.c.name)}">${r.plan !== r.base ? `<div class="tiny">${money(r.plan)} with rollover</div>` : ""}</td>
        <td class="r m hide-m">${money(r.spent)}</td>
        <td class="r m ${left < 0 ? "neg" : ""}">${money(left)}</td></tr>`;
    }
  }
  return `
  ${pageHead("Monthly budget", "Give every dollar a job. Tap an amount to change it — the chart and safe-to-spend update instantly.", `
    <button class="btn" data-action="copy-budget">${icon("repeat")}Copy last month</button>
    <button class="btn primary" data-action="add-cat">${icon("plus")}Category</button>`, { month: mk })}
  ${monthsBar(mk)}
  <div class="grid g4">
    <div class="tile accent"><div class="label">Expected income</div><div class="value">${moneyHTML(inc)}</div></div>
    <div class="tile accent"><div class="label">Budgeted</div><div class="value">${moneyHTML(planned)}</div><div class="sub">${inc ? `${pct(planned, inc)}% of income` : ""}</div></div>
    <div class="tile accent"><div class="label">Spent</div><div class="value">${moneyHTML(spent)}</div><div class="sub">${pct(spent, planned)}% of budget</div></div>
    <div class="tile ${planned - spent < 0 ? "bad" : "good"}"><div class="label">Left in budget</div><div class="value">${moneyHTML(planned - spent)}</div></div>
  </div>
  ${inc && planned > inc ? `<div class="banner mt">⚠️ You've budgeted <b>${money(planned - inc)}</b> more than you expect to earn this month.</div>` : ""}
  <div class="grid g-side mt">
    <div class="card">
      <div class="card-head"><h2>Categories</h2>
        <div class="seg" title="When you change an amount, apply it to…"><button class="${ui.budgetScope === "all" ? "on" : ""}" data-action="budget-scope" data-v="all">Every month</button><button class="${ui.budgetScope === "month" ? "on" : ""}" data-action="budget-scope" data-v="month">Only ${monthName(mk)}</button></div></div>
      <div style="overflow-x:auto"><table class="env"><thead><tr><th>Category</th><th>Progress</th><th class="r">Budget</th><th class="r hide-m">Spent</th><th class="r">Left</th></tr></thead><tbody>${table}</tbody></table></div>
    </div>
    <div class="stack">
      <div class="card"><h3>Your real 50 / 30 / 20</h3><p class="tiny mt-s">How this month's money is actually splitting up.</p>
        <div class="stack mt" style="gap:12px">${split.map(([l, v, target]) => `<div><div class="row between"><b>${l}</b><span class="m">${money(v)} · <b>${pct(v, inc || 1)}%</b> <span class="tiny">/ ${target}%</span></span></div><div class="mt-s">${progressBar(pct(v, inc || 1), 100)}</div></div>`).join("")}</div>
      </div>
      <div class="card"><h3>Envelope tips</h3>
        <p class="tiny mt-s">↻ <b>Rollover</b>: turn it on for a category (tap its name) and unspent money carries into next month — perfect for gifts, car repairs or travel.</p>
        <p class="tiny mt-s">Bills you check off are counted in their category automatically.</p>
      </div>
    </div>
  </div>
  <div class="card mt"><div class="card-head"><h2>Budget vs. actuals — ${monthName(mk)}</h2></div>
    ${chartPlanVsActual(chartItems(rows, 14))}
  </div>`;
}

/* ---------- Bills & subscriptions ---------- */
function viewBills() {
  const today = todayISO();
  const nextOf = (b) => occurrences(b.freq, b.anchor, today, addDays(today, 400), b.endDate)[0];
  const bills = [...S.bills].sort(by((b) => nextOf(b) || "9999"));
  const subs = bills.filter((b) => b.isSub);
  const monthlyAll = sum(bills, (b) => perMonth(b.amount, b.freq));
  const monthlySubs = sum(subs, (b) => perMonth(b.amount, b.freq));
  const cancelSave = sum(subs.filter((b) => b.review === "cancel"), (b) => perMonth(b.amount, b.freq) * 12);
  const row = (b) => {
    const n = nextOf(b);
    const cat = catById(b.catId);
    return `<div class="li"><span class="emoji-badge" style="${catStyle(cat)}">${esc(b.emoji || cat?.emoji || "🧾")}</span>
      <div class="name">${esc(b.name)}<small>${FREQS[b.freq]}${b.autopay ? " · autopay" : ""}${cat ? " · " + esc(cat.name) : ""}</small></div>
      <div class="when" style="width:auto">${n ? `Next: ${relDay(n)}` : "Ended"}</div>
      <div class="amt">${moneyHTML(b.amount)}</div>
      <button class="btn ghost icon-btn" data-action="edit-bill" data-id="${b.id}" aria-label="Edit ${esc(b.name)}">${icon("edit")}</button></div>`;
  };
  return `
  ${pageHead("Bills & subscriptions", "Never miss a payment. Every bill shows up on your calendar and paycheck plan with a checkbox.", `<button class="btn primary" data-action="add-bill">${icon("plus")}Add bill</button>`)}
  <div class="grid g4">
    <div class="tile accent"><div class="label">Bills per month</div><div class="value">${moneyHTML(monthlyAll)}</div><div class="sub">${plural(bills.length, "bill")}</div></div>
    <div class="tile accent"><div class="label">Subscriptions / month</div><div class="value">${moneyHTML(monthlySubs)}</div><div class="sub">${plural(subs.length, "subscription")}</div></div>
    <div class="tile warn"><div class="label">Subscriptions / year</div><div class="value">${moneyHTML(monthlySubs * 12)}</div><div class="sub">That's the real cost 👀</div></div>
    <div class="tile good"><div class="label">Savings if you cancel</div><div class="value">${moneyHTML(cancelSave)}</div><div class="sub">per year, from your review</div></div>
  </div>
  <div class="grid g-side mt">
    <div class="card"><div class="card-head"><h2>All bills</h2></div>
      ${bills.length ? `<div class="list">${bills.map(row).join("")}</div>` : empty("🧾", "No bills yet", "Add rent, utilities, phone, insurance, subscriptions — anything that repeats.", `<button class="btn primary" data-action="add-bill">Add my first bill</button>`)}
    </div>
    <div class="card"><div class="card-head"><h2>Subscription audit</h2></div>
      <p class="tiny">Tap each one: do you still love it? Mark the ones to cancel and see what you'd save.</p>
      ${subs.length ? `<div class="list mt-s">${subs.map((b) => `<div class="li"><div class="name">${esc(b.emoji || "📺")} ${esc(b.name)}<small>${money(perMonth(b.amount, b.freq) * 12)}/year</small></div>
        <button class="pill ${b.review === "cancel" ? "bad" : b.review === "keep" ? "good" : "muted"}" data-action="sub-review" data-id="${b.id}">${b.review === "cancel" ? "Cancel it" : b.review === "keep" ? "Keep ♥" : "Review"}</button></div>`).join("")}</div>` : `<p class="tiny mt">Tick “This is a subscription” when adding a bill to audit it here.</p>`}
    </div>
  </div>`;
}

/* ---------- Savings ---------- */
function viewSavings() {
  const ft = fundTotals();
  const today = todayISO();
  const cur = monthKey(today);
  const monthly = sum(S.funds, (f) => perMonth(f.monthly || 0, f.freq || "monthly"));
  const fundIds = new Set(S.funds.map((f) => f.id));
  const savTx = S.transactions.filter((t) => t.effect?.fundId && fundIds.has(t.effect.fundId));
  const months = [5, 4, 3, 2, 1, 0].map((i) => addMonths(cur, -i));
  const rhythm = months.map((mk) => Math.max(0, ft.saved - sum(savTx.filter((t) => t.date > monthEnd(mk)), (t) => t.amount)));
  const p = ft.target > 0 ? ft.saved / ft.target : 0;
  const card = (f) => {
    const fp = f.target > 0 ? f.saved / f.target : 0;
    const style = catStyle({ hue: f.hue ?? 205 });
    const next = f.monthly > 0 ? scheduleIn(today, addDays(today, 120)).find((o) => o.kind === "fund" && o.refId === f.id && !o.done) : null;
    let needed = "";
    if (f.targetDate && f.target > f.saved) {
      const mLeft = Math.max(1, monthsBetween(cur, monthKey(f.targetDate)));
      needed = `Save <b>${money((f.target - f.saved) / mLeft)}</b>/month to reach it by ${MONTHS_S[fromISO(f.targetDate).getMonth()]} ${f.targetDate.slice(0, 4)}.`;
    } else if (f.monthly > 0 && f.target > f.saved) {
      const mLeft = Math.ceil((f.target - f.saved) / perMonth(f.monthly, f.freq || "monthly"));
      needed = `At this pace you'll get there around <b>${monthLabel(addMonths(cur, mLeft))}</b>.`;
    } else if (fp >= 1) needed = "Fully funded — amazing work! 🦋";
    return `<div class="card fund" style="${style}">
      <div class="fund-top"><span class="big-emoji">${esc(f.emoji || "🐷")}</span><div class="grow"><h3>${esc(f.name)}</h3><div class="tiny">${f.targetDate ? `By ${fmtDay(f.targetDate)} ${f.targetDate.slice(0, 4)}` : "No deadline"}</div></div>
        <button class="btn ghost icon-btn" data-action="edit-fund" data-id="${f.id}" aria-label="Edit ${esc(f.name)}">${icon("dots")}</button></div>
      <div class="row between" style="align-items:baseline"><div><span class="fund-amt">${moneyHTML(f.saved)}</span> <span class="tiny">of ${money(f.target)}</span></div><b style="color:var(--c-ink)">${Math.round(fp * 100)}%</b></div>
      ${progressBar(f.saved, f.target, style, true)}
      <div class="next-box"><span class="e">🐷</span><div>${next ? `<div class="tiny">Next contribution</div><b class="m">${money(next.amount)}</b><div class="tiny">${fmtLong(next.date)}</div>` : `<div class="tiny">No automatic transfer yet</div><button class="btn sm ghost" data-action="edit-fund" data-id="${f.id}" style="padding-left:0">Set one up →</button>`}</div></div>
      ${needed ? `<p class="tiny">${needed}</p>` : ""}
      <button class="btn primary block" data-action="fund-money" data-id="${f.id}" data-mode="add">${icon("plus")}Add a contribution</button>
      <button class="btn ghost sm" data-action="fund-money" data-id="${f.id}" data-mode="withdraw">Withdraw</button>
    </div>`;
  };
  return `
  ${pageHead("My savings goals", "Plans that help tomorrow grow. Each fund has its own progress and plan.", `<button class="btn primary" data-action="add-fund">${icon("plus")}New goal</button>`)}
  <div class="card savings-hero">
    <div class="sh-total"><div class="tiny" style="text-transform:uppercase;letter-spacing:.12em">Total saved</div><div class="sh-value">${moneyHTML(ft.saved, { noCents: true })} <span class="tiny">of ${money(ft.target)}</span></div>
      <div class="tiny">${money(monthly)} planned each month · ${money(Math.max(0, ft.target - ft.saved))} still to go</div></div>
    ${ring(p, { size: 120, stroke: 11, label: `<span class="big-pct" style="font-size:1.5rem">${Math.round(p * 100)}%</span>` })}
    <div class="sh-msg"><p class="serif-msg">${p >= 1 ? "Every goal is funded. Wow." : p >= 0.5 ? "Lovely plans are really taking shape!" : "Little by little, it all adds up."}</p></div>
    ${SKIN.sideArt ? `<div class="sh-art">${SKIN.sideArt}</div>` : ""}
  </div>
  <div class="grid g3 mt">${S.funds.length ? S.funds.map(card).join("") : `<div class="card" style="grid-column:1/-1">${empty("🐷", "Start your first savings goal", "Even $10 a paycheck adds up. An emergency fund is a great first one.", `<button class="btn primary" data-action="add-fund">Create a goal</button>`)}</div>`}</div>
  ${S.funds.length ? `<div class="card mt"><div class="card-head"><div><h2>My savings rhythm</h2><p class="tiny">A steady climb toward your goals — the last 6 months.</p></div></div>
    ${chartLine([{ values: rhythm }], (i) => MONTHS_S[Number(months[i].slice(5)) - 1], { height: 300, width: 1000, points: true, aria: "Total saved at the end of each month" })}</div>` : ""}`;
}

/* ---------- Debt ---------- */
function viewDebt() {
  const dt = debtTotals();
  const card = (d) => {
    const paid = Math.max(0, (d.original || d.balance) - d.balance);
    const orig = d.original || d.balance;
    return `<div class="card">
      <div class="fund-top"><span class="big-emoji" style="${catVars(30)}">${d.balance <= 0 ? "🕊️" : "💳"}</span><div class="grow"><h3>${esc(d.name)}</h3><div class="tiny">${d.apr}% APR · ${money(d.minimum)} minimum · due on the ${ordinal(Number((d.anchor || "").slice(8)) || 1)}</div></div>
        <div style="text-align:right"><div style="font-family:var(--font-head);font-size:1.45rem;font-weight:600">${moneyHTML(d.balance)}</div><div class="tiny">left to pay</div></div></div>
      <div class="mt">${progressBar(paid, orig, catVars(150), true)}</div>
      <div class="row between mt-s"><span class="tiny">${money(paid)} paid off · ${pct(paid, orig)}%</span>
        <div class="row"><button class="btn sm" data-action="debt-pay" data-id="${d.id}">${icon("plus")}Extra payment</button><button class="btn sm ghost" data-action="edit-debt" data-id="${d.id}">${icon("edit")}</button></div></div>
    </div>`;
  };
  return `
  ${pageHead("Debt payoff", "List what you owe, pick a strategy, and see your debt-free date. Every minimum payment lands on your calendar.", `<button class="btn primary" data-action="add-debt">${icon("plus")}Add debt</button>`)}
  ${S.debts.length ? `
  <div class="grid g4">
    <div class="tile accent"><div class="label">Still owed</div><div class="value">${moneyHTML(dt.owed)}</div></div>
    <div class="tile accent"><div class="label">Minimums / month</div><div class="value">${moneyHTML(dt.minimums)}</div></div>
    <div id="debt-kpis" style="display:contents">${debtKpis()}</div>
  </div>
  <div class="grid g-side mt">
    <div class="stack">${S.debts.map(card).join("")}</div>
    <div class="card" id="debt-planner">${debtPlanner()}</div>
  </div>` : `<div class="card">${empty("🕊️", "No debts — or not added yet", "Add credit cards, loans or buy-now-pay-later plans. We'll build your payoff plan and debt-free date.", `<button class="btn primary" data-action="add-debt">Add a debt</button>`)}</div>`}`;
}
const ordinal = (n) => n + (["th", "st", "nd", "rd"][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || "th");
function debtKpis() {
  const r = simulateDebts(ui.debtStrategy, ui.debtExtra);

function debtPlanner() {
  const r = simulateDebts(ui.debtStrategy, ui.debtExtra);

  return `<div class="card-head"><h2>Payoff planner</h2></div>

    </div>
    <div class="mt">${chartLine([{ values: r.series }, { values: base.series, cls: "alt" }], (i) => { const mk = addMonths(cur, i); return `${MONTHS_S[Number(mk.slice(5)) - 1]} ’${mk.slice(2, 4)}`; }, { height: 230, width: 420, aria: "Total debt balance over time" })}</div>

      <div class="row mt"><input class="input" placeholder="Add a tiny next step…" data-input="goal-step-add" data-id="${g.id}" style="padding:7px 10px"><button class="btn sm ghost" data-action="edit-goal" data-id="${g.id}">${icon("edit")}</button></div>

/* ---------- Impulse Pause ---------- */
function timeLeft(ms) {
  const h = Math.ceil(ms / 3600000);
  if (h >= 48) return `${Math.floor(h / 24)}d ${h % 24}h`;
  if (h >= 1) return `${h}h`;
  return `${Math.max(1, Math.ceil(ms / 60000))}m`;
}
function viewImpulse() {
  const now = Date.now();
  const waiting = S.wishlist.filter((w) => !w.decision).sort(by((w) => w.readyAt));
  const decided = S.wishlist.filter((w) => w.decision).sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0));
  return `
  ${pageHead("Impulse Pause", "Want something right now? Park it here. When the timer ends, decide with a calm brain — not a dopamine rush.")}
  <div class="grid g3">
    <div class="tile good big"><div class="label">Saved by pausing</div><div class="value">${moneyHTML(S.skippedTotal || 0)}</div><div class="sub">${plural(decided.filter((w) => w.decision === "skipped").length, "item")} skipped</div></div>
    <div class="tile accent"><div class="label">Waiting it out</div><div class="value">${waiting.length}</div><div class="sub">${money(sum(waiting, (w) => w.price))} on pause</div></div>
    <div class="tile accent"><div class="label">Bought after thinking</div><div class="value">${decided.filter((w) => w.decision === "bought").length}</div><div class="sub">no guilt — you decided on purpose</div></div>
  </div>
  <div class="grid g-side mt">
    <div class="stack">
      ${waiting.length ? waiting.map((w) => {
        const ready = now >= w.readyAt;
        return `<div class="card wish ${ready ? "ready" : ""}"><span class="big-emoji">${ready ? "⏰" : "⏳"}</span>
          <div class="grow"><h3>${esc(w.name)}</h3><div class="tiny">${money(w.price)}${/^https?:\/\//i.test(w.link || "") ? ` · <a href="${esc(w.link)}" target="_blank" rel="noopener noreferrer">link</a>` : ""} · paused ${relDay(toISO(new Date(w.addedAt))).toLowerCase()}</div>
            ${ready ? `<p class="mt-s"><b>Pause over.</b> Do you still want it as much?</p>` : `<div class="timer mt-s">Ready in ${timeLeft(w.readyAt - now)}</div>`}</div>
          <div class="stack" style="gap:6px">${ready ? `<button class="btn sm primary" data-action="wish-skip" data-id="${w.id}">Skip it 💎</button><button class="btn sm" data-action="wish-buy" data-id="${w.id}">Buy it</button>` : `<button class="btn sm" data-action="wish-skip" data-id="${w.id}">Skip now</button>`}<button class="btn sm ghost" data-action="wish-delete" data-id="${w.id}">Remove</button></div></div>`;
      }).join("") : `<div class="card">${empty("⏸️", "Nothing on pause", "Next time you're about to buy on a whim, add it here first. Most urges fade in 48 hours.")}</div>`}
      ${decided.length ? `<div class="card"><h3>History</h3><div class="list mt-s">${decided.slice(0, 12).map((w) => `<div class="li"><div class="name">${esc(w.name)}<small>${w.decision === "skipped" ? "Skipped" : "Bought"} · ${relDay(toISO(new Date(w.decidedAt || w.addedAt)))}</small></div><span class="pill ${w.decision === "skipped" ? "good" : "muted"}">${w.decision === "skipped" ? "+" + money(w.price) + " kept" : money(w.price)}</span></div>`).join("")}</div></div>` : ""}
    </div>
    <form class="card" data-form="wish">
      <h3>Pause a purchase</h3>
      <div class="stack mt" style="gap:12px">
        ${field("What do you want?", inp("name", "", 'required placeholder="e.g. New sneakers"'))}
        ${field("Price", moneyInp("price", "", "required"))}
        ${field("Link", inp("link", "", 'type="url" placeholder="Optional"'))}
        <div class="field"><span>Wait for</span><div class="seg">${[["24", "24h"], ["48", "48h"], ["72", "3 days"], ["168", "1 week"]].map(([v, l], i) => `<label style="cursor:pointer"><input type="radio" name="hours" value="${v}" ${i === 1 ? "checked" : ""} class="sr-only"><button type="button" class="${i === 1 ? "on" : ""}" data-action="seg-radio">${l}</button></label>`).join("")}</div></div>

  </div>`;
}

/* ---------- Year in review ---------- */
function viewYear() {
  const yr = ui.year;
  const rows = MONTHS_S.map((label, i) => {
    const mk = `${yr}-${pad(i + 1)}`;
    const txs = txInMonth(mk);
    return { label, mk, inc: sum(txs.filter((t) => t.type === "income"), (t) => t.amount), spent: sum(txs.filter((t) => t.type === "expense"), (t) => t.amount), saved: sum(txs.filter((t) => t.type === "saving"), (t) => t.amount) };
  }).map((r) => ({ ...r, out: r.spent + r.saved }));
  const inc = sum(rows, (r) => r.inc), spent = sum(rows, (r) => r.spent), saved = sum(rows, (r) => r.saved);
  const yearTx = txInRange(`${yr}-01-01`, `${yr}-12-31`).filter((t) => t.type === "expense");
  const byCat = {};
  for (const t of yearTx) byCat[t.catId] = (byCat[t.catId] || 0) + t.amount;
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxCat = top[0]?.[1] || 1;
  return `
  ${pageHead(`Year in review — ${yr}`, "Your income, spending and savings over time. Progress looks good on you.", `<button class="btn" data-action="year" data-v="${yr - 1}">${icon("chevL")}${yr - 1}</button><button class="btn" data-action="year" data-v="${yr + 1}">${yr + 1}${icon("chevR")}</button><button class="btn" data-action="print">${icon("printer")}Print</button>`)}
  <div class="grid g4">
    <div class="tile good"><div class="label">Total income</div><div class="value">${moneyHTML(inc)}</div></div>
    <div class="tile accent"><div class="label">Total spent</div><div class="value">${moneyHTML(spent)}</div></div>
    <div class="tile info"><div class="label">Moved to savings</div><div class="value">${moneyHTML(saved)}</div></div>
    <div class="tile accent"><div class="label">Savings rate</div><div class="value">${inc ? Math.round(((inc - spent) / inc) * 100) : 0}%</div><div class="sub">of income not spent</div></div>
  </div>
  <div class="card mt"><div class="card-head"><h2>Money in vs. money out</h2></div>${chartInOut(rows)}</div>
  <div class="grid g2 mt">
    <div class="card"><div class="card-head"><h2>Top categories</h2></div>
      ${top.length ? `<div class="stack" style="gap:10px">${top.map(([id, v]) => { const c = catById(id); return `<div><div class="row between"><span>${esc(c?.emoji || "")} ${esc(c?.name || "Other")}</span><b class="m">${money(v)}</b></div><div class="mt-s">${progressBar(v, maxCat, catStyle(c))}</div></div>`; }).join("")}</div>` : `<p class="tiny">No spending recorded in ${yr}.</p>`}
    </div>
    <div class="card"><div class="card-head"><h2>Month by month</h2></div>
      <div style="overflow-x:auto"><table class="env"><thead><tr><th>Month</th><th class="r">In</th><th class="r">Out</th><th class="r">Net</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td><button class="btn ghost sm" data-action="open-month" data-mk="${r.mk}">${MONTHS_S[Number(r.mk.slice(5)) - 1]}</button></td><td class="r m">${money(r.inc)}</td><td class="r m">${money(r.out)}</td><td class="r m ${r.inc - r.out < 0 ? "neg" : "pos"}">${money(r.inc - r.out)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
  </div>`;
}

function commit(msg, undo) {
  save();
  checkBadges();
  render();
  if (msg) toast(msg, undo ? { undo } : {});
}
/** Snapshot-based undo: simple and always correct. */
function snapshot() {
  const snap = JSON.stringify(S);
  return () => { S = migrate(JSON.parse(snap)); save(); render(); };
}

/* ---------- Quick add / edit transaction ---------- */
function openTxForm(tx = null, preset = {}) {
  const t = tx || { type: "expense", amount: preset.amount ?? "", name: preset.name || "", date: preset.date || todayISO(), catId: preset.catId || "", note: "" };
  let type = t.type === "saving" ? "saving" : t.type;
  const freq = frequentSpends();
  const fundOpts = S.funds.map((f) => [f.id, `${f.emoji} ${f.name}`]);
  const locked = !!t.link;
  const body = () => `
    ${!tx && freq.length ? `<div class="chips" style="margin-bottom:14px">${freq.slice(0, 4).map((f, i) => `<button type="button" class="chip" data-repeat="${i}">${esc(catById(f.catId)?.emoji || "")} ${esc(f.name)} · ${money(f.amount)}</button>`).join("")}</div>` : ""}
    ${locked ? `<div class="banner" style="margin-bottom:14px">This was created by checking off a scheduled item. Delete it to un-check.</div>` : ""}
    <div class="seg" style="margin-bottom:14px" ${locked ? "hidden" : ""}>${[["expense", "Spend"], ["income", "Income"], ["saving", "Savings"]].map(([v, l]) => `<button type="button" class="${type === v ? "on" : ""}" data-type="${v}">${l}</button>`).join("")}</div>
    <div class="money-input">${moneyInp("amount", t.amount === "" ? "" : Math.abs(t.amount), 'required autofocus aria-label="Amount"')}</div>
    <div class="mt" data-part="cats" ${type !== "expense" ? "hidden" : ""}>
      <div class="cat-grid">${S.categories.map((c) => `<button type="button" class="chip ${t.catId === c.id ? "on" : ""}" data-cat="${c.id}" style="${catStyle(c)}"><span class="e">${esc(c.emoji)}</span>${esc(c.name)}</button>`).join("")}</div>
    </div>
    <div class="mt" data-part="fund" ${type !== "saving" ? "hidden" : ""}>${fundOpts.length ? field("Which fund?", sel("fundId", fundOpts, t.effect?.fundId)) : `<p class="tiny">Create a savings fund first to track transfers into it.</p>`}</div>
    <input type="hidden" name="catId" value="${esc(t.catId || "")}">
    <div class="form-grid mt">
      ${field("Name", inp("name", t.name, 'placeholder="e.g. Coffee run" maxlength="80"'))}
      ${field("Date", inp("date", t.date, 'type="date" required'))}
      ${field("Notes (optional)", `<textarea class="input" name="note" placeholder="Anything worth remembering" style="min-height:60px">${esc(t.note || "")}</textarea>`, "full")}
    </div>`;
  const form = openModal({
    title: tx ? "Edit entry" : "Track a spend",
    body: body(),
    foot: `${tx ? `<button type="button" class="btn danger left" data-del>${icon("trash")}Delete</button>` : ""}<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${tx ? "Save" : "Add"}</button>`,
    onSubmit: (d) => {
      const amount = num(d.amount);
      if (!(amount > 0)) { toast("Enter an amount above zero"); return false; }
      if (type === "saving" && !d.fundId) { toast("Pick a fund"); return false; }
      const cat = catById(d.catId);
      const rec = {
        type, amount, date: d.date || todayISO(), note: d.note.trim(),
        name: d.name.trim() || (type === "income" ? "Income" : type === "saving" ? "Savings transfer" : cat?.name || "Spend"),
        catId: type === "income" ? "income" : type === "saving" ? "savings" : d.catId,
      };
      if (type === "saving") rec.effect = { fundId: d.fundId };
      if (tx) {
        if (tx.link) rec.type = tx.type, rec.catId = tx.catId, rec.effect = tx.effect;
        const undo = snapshot();
        updateTx(tx.id, rec);
        commit("Saved", undo);
      } else {
        const undo = snapshot();
        addTx(rec);
        preset.onAdded?.();
        commit(`${type === "income" ? "Income" : type === "saving" ? "Transfer" : "Spend"} added — ${money(amount)}`, undo);
        if (type === "expense") nudgeIfOver(rec.catId, monthKey(rec.date));
      }
    },
  });
  form.addEventListener("click", (e) => {
    const tb = e.target.closest("[data-type]");
    if (tb) {
      type = tb.dataset.type;
      $$("[data-type]", form).forEach((b) => b.classList.toggle("on", b === tb));
      $("[data-part=cats]", form).hidden = type !== "expense";
      $("[data-part=fund]", form).hidden = type !== "saving";
    }
    const cb = e.target.closest("[data-cat]");
    if (cb) {
      $$("[data-cat]", form).forEach((b) => b.classList.toggle("on", b === cb));
      form.catId.value = cb.dataset.cat;
      if (!form.name.value) form.name.placeholder = catById(cb.dataset.cat)?.name || "";
    }
    const rb = e.target.closest("[data-repeat]");
    if (rb) {
      const f = freq[Number(rb.dataset.repeat)];
      form.amount.value = f.amount;
      form.name.value = f.name;
      form.catId.value = f.catId;
      $$("[data-cat]", form).forEach((b) => b.classList.toggle("on", b.dataset.cat === f.catId));
    }
    if (e.target.closest("[data-del]")) {
      const undo = snapshot();
      removeTx(tx.id);
      closeModal();
      commit("Deleted", undo);
    }
  });
}
function nudgeIfOver(catId, mk) {
  const c = S.categories.find((x) => x.id === catId);
  if (!c) return;
  const plan = catAvailable(c, mk), spent = catSpent(c.id, mk);
  if (plan > 0 && spent > plan) setTimeout(() => toast(`Heads up: ${c.name} is ${money(spent - plan)} over budget this month`), 400);
  else if (plan > 0 && spent > plan * 0.85) setTimeout(() => toast(`${c.name}: ${money(plan - spent)} left this month`), 400);
}

/* ---------- Debts ---------- */
function anchorForDay(day) {
  const mk = monthKey(todayISO());
  const [y, m] = mk.split("-").map(Number);
  return `${mk}-${pad(Math.min(clamp(Number(day) || 1, 1, 31), daysInMonth(y, m - 1)))}`;
}
function openDebtForm(debt = null) {
  const d0 = debt || { name: "", balance: "", apr: "", minimum: "", anchor: anchorForDay(15) };
  openModal({
    title: debt ? "Edit debt" : "Add a debt",
    body: `<div class="form-grid">
      ${field("Name", inp("name", d0.name, 'required placeholder="Visa card, car loan…"'), "full")}
      ${field("Current balance", moneyInp("balance", d0.balance, "required"))}
      ${field("Interest rate (APR %)", inp("apr", d0.apr, 'type="number" step="0.01" min="0" max="100" placeholder="e.g. 22.9"'))}
      ${field("Minimum payment / month", moneyInp("minimum", d0.minimum))}
      ${field("Due day of month", inp("day", Number(d0.anchor.slice(8)), 'type="number" min="1" max="31"'))}
      ${debt ? field("Original amount", moneyInp("original", d0.original), "", "for your progress bar") : ""}
    </div>`,
    foot: `${debt ? `<button type="button" class="btn danger left" data-del>${icon("trash")}Delete</button>` : ""}<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${debt ? "Save" : "Add debt"}</button>`,
    onSubmit: (d) => {
      if (!d.name.trim()) { toast("Give it a name"); return false; }
      const undo = snapshot();
      const rec = { name: d.name.trim(), balance: round2(num(d.balance)), apr: num(d.apr), minimum: round2(num(d.minimum)) };
      const day = clamp(Number(d.day) || 1, 1, 31);
      if (debt) {
        // Keep the original anchor's month so past payments keep matching their dates.
        const [y, m] = debt.anchor.slice(0, 7).split("-").map(Number);
        rec.anchor = `${debt.anchor.slice(0, 7)}-${pad(Math.min(day, daysInMonth(y, m - 1)))}`;
        rec.original = round2(num(d.original)) || Math.max(debt.original || 0, rec.balance);
        Object.assign(debt, rec);
      } else S.debts.push({ id: uid(), ...rec, original: rec.balance, anchor: anchorForDay(day) });
      commit(debt ? "Debt updated" : "Debt added — your payoff plan is ready", undo);
    },
    onMount: (form) => form.querySelector("[data-del]")?.addEventListener("click", () => {
      const undo = snapshot();
      S.debts = S.debts.filter((x) => x !== debt);
      closeModal();
      commit("Debt removed", undo);
    }),
  });
}
function openDebtPay(debt) {
  openModal({
    title: `Extra payment — ${debt.name}`,
    body: `<div class="money-input">${moneyInp("amount", "", "required autofocus")}</div><div class="form-grid mt">${field("Date", inp("date", todayISO(), 'type="date"'))}${field("Note", inp("note", "", 'placeholder="Optional"'))}</div>`,

    onSubmit: (d) => {
      const amount = num(d.amount);

      const undo = snapshot();
      addTx({ type: "expense", catId: "debt", name: `${debt.name} extra payment`, amount, date: d.date || todayISO(), note: d.note, effect: { debtId: debt.id } });
      const done = debt.balance <= 0;
      commit(`Payment recorded — ${money(debt.balance)} left`, undo);
      if (done) celebrate("🕊️", `${debt.name} is paid off!`, "One less thing on your mind.");
    },
  });
}

function openFundMoney(fund, mode) {
  openModal({
    title: `${mode === "add" ? "Add to" : "Withdraw from"} ${fund.name}`,
    body: `<div class="money-input">${moneyInp("amount", "", "required autofocus")}</div><div class="form-grid mt">${field("Date", inp("date", todayISO(), 'type="date"'))}${field("Note", inp("note", "", 'placeholder="Optional"'))}</div>
      <p class="tiny mt">${mode === "add" ? "This counts as money set aside, so it lowers this month's safe to spend." : "Withdrawals add the money back into this month's safe to spend."}</p>`,
    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${mode === "add" ? "Add money" : "Withdraw"}</button>`,
    onSubmit: (d) => {
      let amount = num(d.amount);
      if (!(amount > 0)) return false;
      if (mode === "withdraw") amount = -Math.min(amount, fund.saved);
      const before = fund.target > 0 ? fund.saved / fund.target : 0;
      const undo = snapshot();
      addTx({ type: "saving", catId: "savings", name: `${mode === "add" ? "Transfer to" : "Withdrawal from"} ${fund.name}`, amount, date: d.date || todayISO(), note: d.note, effect: { fundId: fund.id } });
      const after = fund.target > 0 ? fund.saved / fund.target : 0;
      commit(`${fund.name}: ${money(fund.saved)}`, undo);
      const hit = [1, 0.75, 0.5, 0.25].find((m) => before < m && after >= m);
      if (hit) celebrate(hit === 1 ? "🦋" : "🎉", hit === 1 ? `${fund.name} is fully funded!` : `${fund.name} is ${hit * 100}% there!`, "Look at you go.");
    },
  });
}

      else S.goals.push({ id: uid(), ...rec, steps: (d.steps || "").split("\n").map((s) => s.trim()).filter(Boolean).map((text) => ({ text, done: false })) });
      commit(goal ? "Goal updated" : "Goal added 🌈", undo);
      if (rec.status === "done" && goal?.status !== "done") confetti();
    },
    onMount: (form) => form.querySelector("[data-del]")?.addEventListener("click", () => {
      const undo = snapshot();
      S.goals = S.goals.filter((x) => x !== goal);
      closeModal();
      commit("Goal deleted", undo);
    }),
  });
}

/* ---------- CSV ---------- */
const csvCell = (v) => {
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d/.test(s)) s = "'" + s; // keep spreadsheets from running it as a formula
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
function exportCSV() {
  const rows = [["Date", "Type", "Category", "Name", "Amount", "Note"]];
  for (const t of [...S.transactions].sort(by((t) => t.date))) rows.push([t.date, t.type, catById(t.catId)?.name || "", t.name, t.amount.toFixed(2), t.note || ""]);
  download(`${APP_NAME.replace(/\s/g, "-").toLowerCase()}-transactions-${todayISO()}.csv`, rows.map((r) => r.map(csvCell).join(",")).join("\n"), "text/csv");
  toast("Transactions exported");
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  // Use the delimiter the header line actually uses, so "1.234,56" survives in ;-separated files.
  const head = text.slice(0, text.search(/\r?\n|$/));
  const delim = [";", "\t", ","].map((d) => [d, head.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
/** Bank amounts: "1,234.56", "1.234,56", "-12,5", "(45.00)", "€ 12" … → number. */
function parseAmount(raw) {
  let s = String(raw ?? "").trim();
  if (!s) return 0;
  const negative = /^\(.*\)$/.test(s) || /^-|-$|^−/.test(s.replace(/[^\d\-−().,]/g, ""));
  s = s.replace(/[^\d.,]/g, "");
  const lastDot = s.lastIndexOf("."), lastComma = s.lastIndexOf(",");
  if (lastDot >= 0 && lastComma >= 0) s = lastComma > lastDot ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (lastComma >= 0) s = /,\d{3}$/.test(s) && s.indexOf(",") === lastComma && s.length > 4 ? s.replace(",", "") : s.replace(/,/g, ".");
  const n = parseFloat(s);
  return Number.isFinite(n) ? (negative ? -n : n) : 0;
}
const DATE_RE = /^(\d{1,2})([\/.-])(\d{1,2})\2(\d{2,4})/;
/** Work out whether a file writes dates day-first (most of the world) or month-first (US). */
function dateOrder(values) {
  let dmy = 0, mdy = 0, dots = 0;
  for (const v of values) {
    const m = String(v).trim().match(DATE_RE);
    if (!m) continue;
    if (Number(m[1]) > 12) dmy++;
    if (Number(m[3]) > 12) mdy++;
    if (m[2] === "." || m[2] === "-") dots++;
  }
  if (dmy && !mdy) return "dmy";
  if (mdy && !dmy) return "mdy";
  return dots ? "dmy" : "mdy";
}
function normDate(s, order = "mdy") {
  s = s.trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(DATE_RE);
  if (m) {
    let [, a, , b, y] = m;
    if (y.length === 2) y = "20" + y;
    const [mo, d] = order === "dmy" ? [b, a] : [a, b];
    if (Number(mo) > 12 || Number(d) > 31) return "";
    return `${y}-${pad(mo)}-${pad(d)}`;
  }
  const d = new Date(s);
  return isNaN(d) ? "" : toISO(d);
}
function importCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return toast("That file looks empty");
  const head = rows[0].map((h) => h.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
  const col = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
  // English first, then common bank-export headers in French, Spanish, German, Dutch, Italian and Portuguese.
  const ci = {
    date: col("date", "datum", "fecha", "data"),
    name: col("name", "description", "payee", "merchant", "memo", "details", "libelle", "omschrijving", "concepto", "beschreibung", "verwendungszweck", "descrizione", "descricao"),
    amount: col("amount", "value", "sum", "montant", "bedrag", "importe", "betrag", "importo", "valor"),
    cat: col("category", "categorie", "kategorie", "categoria"),
    type: col("type"),
    note: col("note", "notiz", "nota"),
  };
  const debit = col("debit", "withdrawal", "soll", "cargo"), credit = col("credit", "deposit", "haben", "abono");
  if (ci.date < 0 || (ci.amount < 0 && debit < 0)) return toast("Couldn't find Date and Amount columns");
  const body = rows.slice(1);
  // If the file uses signed amounts (bank style), negative = money out, positive = money in.
  // If every amount is positive, treat them all as spending.
  const signed = ci.amount >= 0 && body.some((r) => parseAmount(r[ci.amount]) < 0);
  const order = dateOrder(body.map((r) => r[ci.date]));
  const undo = snapshot();
  let n = 0;
  for (const r of body) {
    const date = normDate(r[ci.date] || "", order);
    if (!date) continue;
    let amount = ci.amount >= 0 ? parseAmount(r[ci.amount]) : parseAmount(r[credit]) - parseAmount(r[debit]);
    let type = (r[ci.type] || "").trim().toLowerCase();
    if (!["expense", "income", "saving"].includes(type)) type = (ci.amount < 0 || signed) && amount > 0 ? "income" : "expense";
    amount = Math.abs(amount);
    if (!amount) continue;
    let catId = type === "income" ? "income" : "";
    const catName = (r[ci.cat] || "").trim();
    if (type === "expense" && catName) {
      let c = S.categories.find((x) => x.name.toLowerCase() === catName.toLowerCase());
      if (!c) { c = { id: uid(), name: catName, emoji: "✨", group: "wants", budget: 0, hue: CAT_HUES[S.categories.length % CAT_HUES.length], rollover: false }; S.categories.push(c); }
      catId = c.id;
    }
    if (type === "saving") catId = "savings";
    S.transactions.push({ id: uid(), createdAt: Date.now() + n, type, catId, name: (r[ci.name] || "").trim().slice(0, 80) || "Imported", amount: round2(amount), date, note: (r[ci.note] || "").trim() });
    n++;
  }
  commit(`Imported ${plural(n, "transaction")}`, undo);
}

/* ---------- Backup ---------- */
function exportJSON() {
  if (IS_DEMO) return toast("Backups are part of the full version");
  S.settings.lastBackup = todayISO();
  saveNow();
  download(`${APP_NAME.replace(/\s/g, "-").toLowerCase()}-backup-${todayISO()}.json`, JSON.stringify(S, null, 1));
  render();
  toast("Backup saved — keep it somewhere safe");
}
function importJSON(text) {
  let data;
  try { data = JSON.parse(text); } catch { return toast("That isn't a valid backup file"); }
  if (!data || !Array.isArray(data.transactions) || !data.profile) return toast("That isn't a backup from this planner");
  confirmBox("Restore this backup?", `It has ${plural(data.transactions.length, "transaction")}. Everything currently in the planner will be replaced.`, "Restore", () => {
    S = migrate(data);
    S.onboarded = true;
    saveNow();
    applyTheme();
    render();
    toast("Backup restored");
  });
}

      setTimeout(() => openOnboarding(step + 1), 10);
    },
  });
  form.querySelector("[data-ob=skip]")?.addEventListener("click", () => openOnboarding(step + 1));
  form.querySelector("[data-ob=sample]")?.addEventListener("click", () => { closeModal(); loadSample(); go("home"); toast("Sample data loaded — have a look around!"); });
}

  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Horizontal strips start at the useful end: charts at the latest month, month chips at the selected one. */
const H_STRIPS = ".chart-scroll, [data-drag-scroll], .chip-scroll, .months";
function settleScrollers(root) {
  for (const el of root.querySelectorAll("[data-scroll-end]")) el.scrollLeft = el.scrollWidth;
  for (const el of root.querySelectorAll(".month-chips, .months")) {
    const on = el.querySelector(".on");
    if (on && el.scrollWidth > el.clientWidth) el.scrollLeft = on.offsetLeft - el.offsetLeft - (el.clientWidth - on.offsetWidth) / 2;
  }
  for (const el of root.querySelectorAll(H_STRIPS)) edgeFade(el);
}
/** Soft fade on the side of a strip that has more to swipe to. */
function edgeFade(el) {
  const max = el.scrollWidth - el.clientWidth;
  el.classList.toggle("fade-l", max > 1 && el.scrollLeft > 2);
  el.classList.toggle("fade-r", max > 1 && el.scrollLeft < max - 2);
}
/** Mouse users can drag horizontal strips (charts, month chips) like on a phone. */
function enableDragScroll() {
  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    if (e.target.closest("input, textarea, select")) return;
    const el = e.target.closest(H_STRIPS);
    if (!el || el.scrollWidth <= el.clientWidth + 1) return;
    drag = { el, x: e.clientX, left: el.scrollLeft, moved: false };
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) < 5) return;
    drag.moved = true;
    drag.el.classList.add("dragging");
    drag.el.scrollLeft = drag.left - dx;
  });
  document.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    d.el.classList.remove("dragging");
    // A drag is not a click on whatever was under the mouse.
    if (d.moved) {
      const stop = (e) => { e.stopPropagation(); e.preventDefault(); };
      document.addEventListener("click", stop, { capture: true, once: true });
      setTimeout(() => document.removeEventListener("click", stop, { capture: true }), 0);
    }
  });
}

/* ==========================================================================

   really in the account, envelopes, fresh start, can-I-afford-it, money back,
   fees check, calendar export and Apple Pay quick entry.

const BAL = !!SKIN.balance;

/* ---------- Engine ---------- */
/** Does this transaction change the balance the user last confirmed? */
const afterCheck = (t) => !t.absorbed && (t.createdAt || 0) > (S.account.checkedAt || 0);
const txDelta = (t) => (t.type === "income" ? t.amount : -t.amount);
function balanceNow() {
  return round2((S.account.balance || 0) + sum(S.transactions.filter(afterCheck), txDelta));
}
const primaryIncome = () => S.incomes.find((i) => i.primary) || S.incomes[0];
/** The next payday that hasn't been confirmed yet (today included), or a manual planning date. */
function nextPayday(today = todayISO()) {
  const inc = primaryIncome();
  if (S.account.irregular) {
    // Irregular income: the stretch the user chose; once it's over, the guide waits for a new one.
    const h = S.account.horizon;
    return h && h > today ? { date: h, occ: null } : { date: today, occ: null, ended: true };
  }
  if (inc) {
    const o = scheduleIn(today, addDays(today, 400)).find((x) => x.kind === "income" && x.refId === inc.id && !x.done);
    if (o) return { date: o.date, occ: o };
  }
  const manual = S.account.horizon;
  if (manual && manual > today) return { date: manual, occ: null };
  return { date: addDays(monthEnd(monthKey(today)), 1), occ: null };
}
/** Bills, debt minimums and savings transfers still to pay up to (and including) payday, plus anything overdue. */
function commitmentsUntil(h, today = todayISO()) {
  const from = S.account.openFrom || S.account.checkedOn || today;
  return scheduleIn(from < today ? from : today, h).filter((o) => o.kind !== "income" && !o.done && (o.date >= today || o.date >= from));
}
function availableSummary(today = todayISO()) {
  const pay = nextPayday(today);
  const h = pay.date;
  const balance = balanceNow();
  const due = commitmentsUntil(h, today);
  const bills = round2(sum(due, (o) => o.amount));
  const reserved = round2(sum(S.envelopes, (e) => e.amount));
  const buffer = round2(S.profile.buffer || 0);
  const margin = round2(balance - bills - reserved - buffer);
  const available = Math.max(0, margin), shortBy = Math.max(0, -margin);
  const days = diffDays(today, h); // today included, payday excluded
  const todays = S.transactions.filter((t) => t.date === today && t.type === "expense" && !t.link && afterCheck(t));
  const spentToday = round2(sum(todays, (t) => t.amount));
  const confirmPayday = days <= 0;
  // The daily guide is recalculated from today: what's left plus what you already spent today, shared out.
  const guide = confirmPayday ? 0 : Math.floor(((available + spentToday) * 100) / days) / 100;
  const checkedDays = S.account.checkedOn ? diffDays(S.account.checkedOn, today) : null;
  return { today, h, pay, balance, due, bills, reserved, buffer, margin, available, shortBy, days, spentToday, guide, leftToday: round2(guide - spentToday), confirmPayday, checkedDays, stale: checkedDays == null || checkedDays >= 7 };
}
/** What a purchase would leave, without recording anything. */
function previewPurchase(amount) {

/* ---------- Fees & repeat-charge check (heuristic, local only) ---------- */
const FEE_RE = /\b(fee|fees|charge|overdraft|late|interest|atm|foreign|penalty|service charge|nsf|maintenance)\b/i;
const normName = (s) => String(s || "").toLowerCase().replace(/[0-9#*]+/g, " ").replace(/\s+/g, " ").trim();
function feesScan(today = todayISO()) {
  const since = addDays(today, -365);
  const tx = S.transactions.filter((t) => t.type === "expense" && t.date >= since && !t.link);
  const fees = tx.filter((t) => FEE_RE.test(t.name) || FEE_RE.test(t.note || ""));
  const groups = {};
  for (const t of tx) (groups[normName(t.name)] ||= []).push(t);
  const repeats = [];
  for (const [name, list] of Object.entries(groups)) {
    if (!name || list.length < 3 || FEE_RE.test(name)) continue; // fees are listed on their own
    const sorted = list.slice().sort(by((t) => t.date));
    const gaps = sorted.slice(1).map((t, i) => diffDays(sorted[i].date, t.date));
    const avg = sum(gaps) / gaps.length;
    const amounts = sorted.map((t) => t.amount), mean = sum(amounts) / amounts.length;
    const steady = amounts.every((x) => Math.abs(x - mean) <= Math.max(1, mean * 0.12));
    const monthly = avg >= 25 && avg <= 35, weekly = avg >= 6 && avg <= 8;
    if (steady && (monthly || weekly) && !S.bills.some((b) => normName(b.name) === name)) {
      repeats.push({ name: sorted.at(-1).name, amount: round2(sorted.at(-1).amount), every: monthly ? "month" : "week", count: list.length, yearly: round2(sorted.at(-1).amount * (monthly ? 12 : 52)) });
    }
  }
  const dupes = [];
  const seen = {};
  for (const t of tx.slice().sort(by((t) => t.date))) {
    const k = `${normName(t.name)}|${t.amount}`;
    const prev = seen[k];
    if (prev && diffDays(prev.date, t.date) <= 2 && t.amount >= 5) dupes.push({ a: prev, b: t });
    seen[k] = t;
  }
  const feeTotal = round2(sum(fees, (t) => t.amount));
  return { fees, repeats: repeats.sort(by((r) => -r.yearly)), dupes, feeTotal, yearly: round2(feeTotal + sum(repeats, (r) => r.yearly) + sum(dupes, (d) => d.b.amount)) };
}

/* ---------- Calendar export (.ics) ---------- */
function billsICS(today = todayISO()) {
  const icsDate = (d) => d.replace(/-/g, "");
  const escI = (s) => String(s).replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const occ = scheduleIn(today, addDays(today, 365)).filter((o) => o.kind !== "income");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const ev = occ.map((o) => ["BEGIN:VEVENT", `UID:${o.key.replace(/[^a-z0-9:-]/gi, "")}@${STORE_KEY}`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(o.date)}`, `DTEND;VALUE=DATE:${icsDate(addDays(o.date, 1))}`, `SUMMARY:${escI(`${o.name} — ${money(o.amount)}`)}`, "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", `DESCRIPTION:${escI(o.name)}`, "END:VALARM", "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR", "VERSION:2.0", `PRODID:-//${escI(APP_NAME)}//Bills//EN`, "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";

/* ---------- Apple Pay quick entry ---------- */
// The iPhone Shortcut adds one line per payment:  SPEND|<amount>|<merchant>|<date>
function parseCollected(text) {
  const out = [];
  for (const raw of String(text || "").split(/\r?\n/)) {
    const line = raw.trim();
    if (!/^SPEND\|/i.test(line)) continue;
    const [, amt, merchant = "", when = ""] = line.split("|");
    const amount = Math.abs(parseAmount(amt));
    if (!(amount > 0) || amount > 1e7) continue;
    const d = String(when).match(/\d{4}-\d{2}-\d{2}/)?.[0];
    out.push({ key: line.slice(0, 200), amount: round2(amount), name: merchant.trim().slice(0, 80) || "Apple Pay", date: d && d <= todayISO() ? d : todayISO(), seen: !!S.collected[line.slice(0, 200)] });
  }
  return out;
}

function openBalanceCheck() {
  const today = todayISO();
  const from = S.account.openFrom || S.account.checkedOn || today;
  const late = scheduleIn(from < today ? from : today, addDays(today, -1)).filter((o) => o.kind !== "income" && !o.done);
  openModal({
    title: S.account.checkedOn ? "Start from today" : "Your balance",
    body: `<p class="muted">Look at your banking app and enter what's in your spending account right now. ${S.account.checkedOn ? "You don't need to add the days you missed." : ""}</p>
      <div class="money-input mt">${moneyInp("balance", S.account.checkedOn ? balanceNow() : "", 'autofocus aria-label="Balance right now" min="-10000000"')}</div>
      ${late.length ? `<h3 class="mt-l">Bills from while you were away</h3><p class="tiny">Already taken out of your account? Mark them paid — they won't be taken off again.</p>
        <div class="list mt-s">${late.map((o, i) => `<div class="li"><div class="when">${fmtDay(o.date)}</div><div class="name">${esc(o.name)}</div><div class="amt m">${money(o.amount)}</div>
          ${sel(`late${i}`, [["paid", "Paid already"], ["due", "Still due"], ["skip", "Skipped"]], "paid")}</div>`).join("")}</div>` : ""}`,
    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Start from today</button>`,
    onSubmit: (d) => {
      if (String(d.balance).trim() === "") { toast("Enter your balance"); return false; }
      const undo = snapshot();
      let openFrom = today;
      late.forEach((o, i) => {
        const choice = d[`late${i}`];
        if (choice === "paid") toggleOccurrence(o); // dated before today → recorded as already in the balance
        else if (choice === "skip") S.links[o.key] = "skip";
        else if (o.date < openFrom) openFrom = o.date;
      });
      checkBalance(num(d.balance), openFrom);
      // Paid-while-away items are already in the balance just entered.
      for (const t of S.transactions) if (late.some((o) => o.key === t.link)) t.absorbed = true;
      commit("Fresh start — your number is up to date", undo);
    },
  });
}

/* ==========================================================================
   The Honey Nook: an illustrated cozy room with a companion who reacts to
   what you do, and honey drops you earn for small money habits.
   Only active for editions that ship illustrations (skin.nookImg).
   ========================================================================== */
const NOOK = !!(SKIN.nookImg && SKIN.nookImg["room-day"]);
const nookImg = (k) => (SKIN.nookImg && SKIN.nookImg[k]) || "";
const NOOK_PETS = {
  mochi: { name: "Mochi", kind: "capybara", cost: 0, line: "Calm money, sweet days.", poses: { idle: "mochi-idle", coin: "mochi-coin", happy: "mochi-happy", sleep: "mochi-sleep", cheer: "mochi-cheer" } },
  bun: { name: "Bun", kind: "bunny", cost: 20, line: "Small steps, soft heart.", poses: { idle: "bun-idle", coin: "bun-idle", happy: "bun-idle", sleep: "bun-idle", cheer: "bun-idle" } },
};
const NOOK_ROOMS = {
  "room-day": { name: "Golden hour", cost: 0 },
  "room-winter": { name: "Snowy evening", cost: 25 },
};
// How honey drops are earned (per day caps keep it calm, not grindy).
const NOOK_EARN = {
  spend: { label: "Track a spend", n: 1, cap: 5 },
  bill: { label: "Tick off a bill or payday", n: 2, cap: 6 },
  checkin: { label: "Daily check-in", n: 2, cap: 2 },
  envelope: { label: "Set money aside", n: 2, cap: 4 },
  fresh: { label: "Start from today (balance check)", n: 3, cap: 3 },
  close: { label: "Close your day (evening recap)", n: 3, cap: 3 },
  pat: { label: "Say hello to your friend", n: 1, cap: 3 },
};
let nookQuiet = false; // no rewards while sample data is being generated
let nookPending = null; // reaction to play after the next render

const nookPet = () => NOOK_PETS[S.nook?.pet] || NOOK_PETS.mochi;
function nookEarn(reason) {
  if (!NOOK || nookQuiet || !S.nook) return 0;
  const rule = NOOK_EARN[reason];
  if (!rule) return 0;
  const key = `${todayISO()}:${reason}`;
  const got = S.nook.log[key] || 0;
  if (got >= rule.cap) { nookPending ||= { mood: "happy" }; return 0; }
  const n = Math.min(rule.n, rule.cap - got);
  S.nook.log[key] = got + n;
  S.nook.drops = (S.nook.drops || 0) + n;
  // Keep the log to the last few weeks.
  const cutoff = addDays(todayISO(), -21);
  for (const k of Object.keys(S.nook.log)) if (k.slice(0, 10) < cutoff) delete S.nook.log[k];
  nookPending = { mood: "cheer", text: `+${n} 🍯` };
  return n;
}
/** Morning, day, golden hour or night — the room follows the clock. */
function nookTime(d = new Date()) {
  const h = d.getHours();
  return h >= 21 || h < 6 ? "night" : h < 10 ? "morning" : h >= 17 ? "golden" : "day";
}
function nookRoom(d = new Date()) {
  const pick = S.nook?.room || "auto";
  if (pick !== "auto" && S.nook.owned.includes(pick) && nookImg(pick)) return pick;
  const m = d.getMonth();
  return (m === 11 || m <= 1) && nookImg("room-winter") ? "room-winter" : "room-day";
}
function nookLine(a) {
  const pet = nookPet();
  if (nookTime() === "night") return `Zzz… your bills are covered. Sleep well.`;
  if (!a) return pet.line;
  if (a.checkedDays == null) return "Hi! Tell me your balance and I'll work out today.";
  if (a.stale) return "Welcome back! Let's start from today — no catching up.";
  if (a.confirmPayday) return "Is it payday? Let's check it in together!";
  if (a.shortBy) return "A tight stretch. We'll make room around it, gently.";
  if (a.leftToday > 0) return `${money(a.leftToday)} left for today. You've got this.`;
  return "Today's guide is used up — tomorrow resets, no stress.";
}
function nookPose(a) {
  if (nookTime() === "night") return "sleep";
  if (a && a.leftToday > 0 && !a.shortBy) return "coin";
  return "idle";
}
/** The room, the companion and its speech bubble. `inner` is what floats on the glass card. */
function nookScene({ a = null, inner = "", size = "hero" } = {}) {
  const pet = nookPet(), pose = nookPose(a), room = nookRoom(), time = nookTime();
  const snow = room === "room-winter" ? `<div class="nook-snow" aria-hidden="true">${Array.from({ length: 18 }, (_, i) => `<i style="--x:${(i * 53) % 100}%;--d:${6 + (i % 5)}s;--w:${(i * 7) % 6}s"></i>`).join("")}</div>` : "";
  const motes = `<div class="nook-motes" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i style="--x:${48 + ((i * 37) % 48)}%;--y:${12 + ((i * 23) % 60)}%;--d:${5 + (i % 4)}s;--w:${(i * 3) % 5}s"></i>`).join("")}</div>`;
  return `<div class="nook nook-${size}" data-time="${time}" data-room="${room}">
    <img class="nook-bg" src="${nookImg(room)}" alt="" aria-hidden="true" draggable="false">
    <div class="nook-light" aria-hidden="true"></div>
    ${snow}${motes}
    ${inner ? `<div class="nook-card">${inner}</div>` : ""}
    <div class="nook-friend">
      <div class="nook-bubble" role="status">${esc(nookLine(a))}</div>
      <button class="nook-pet pose-${pose}" data-action="nook-pat" aria-label="Say hello to ${esc(pet.name)}" title="Say hello to ${esc(pet.name)}">

    <a class="nook-drops" href="#nook" title="Your honey drops">🍯 <b>${S.nook.drops || 0}</b><span>honey drops</span></a>
  </div>`;
}
/** Play the companion's reaction after a render (swap pose, hop, floating reward). */
function nookAfterRender() {
  if (!NOOK || !nookPending) return;
  const p = nookPending;
  nookPending = null;
  const btn = $(".nook-pet");
  if (!btn) return;
  const pet = nookPet();
  const img = btn.querySelector("img");

/* ---------- Animated number ---------- */
let tdShown = null; // last value the big number showed, so it only counts when it changes
function countUp() {
  const el = $(".avail[data-count]");
  if (!el) return;
  const to = Number(el.dataset.count), from = tdShown;
  tdShown = to;
  // Automated screenshots stay still unless a demo recording asks for motion.
  const still = S.settings.motion === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches || (navigator.webdriver && !window.__motionDemo);
  if (still || from === to) return;
  const start = from ?? 0, t0 = performance.now(), dur = from == null ? 1100 : 650;
  el.classList.add("counting");
  el.innerHTML = moneyHTML(start);
  const step = (t) => {
    if (!el.isConnected) return;
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = moneyHTML(k < 1 ? start + (to - start) * e : to);
    if (k < 1) requestAnimationFrame(step); else el.classList.remove("counting");
  };
  requestAnimationFrame(step);
}

/* ---------- Forecast until payday ---------- */
/** End-of-day balance from today to payday if you spend your daily guide and pay every bill on its date. */
function paydayForecast(a = availableSummary()) {
  if (a.confirmPayday || a.days <= 0 || a.checkedDays == null) return null;
  const pts = [], events = [];
  let bal = a.balance;
  for (let i = 0; i <= a.days; i++) {
    const d = addDays(a.today, i);
    const due = a.due.filter((o) => (i === 0 ? o.date <= d : o.date === d));
    for (const o of due) bal -= o.amount;
    if (due.length) events.push({ i, d, items: due });
    if (i < a.days) bal -= i === 0 ? Math.max(0, a.leftToday) : a.guide;
    pts.push({ i, d, v: round2(bal) });
  }
  const low = pts.reduce((m, p) => (p.v < m.v ? p : m), pts[0]);
  return { start: a.balance, pts, events, low, end: pts.at(-1).v, pay: a.pay.occ ? a.pay.occ.amount : 0, h: a.h };
}
function forecastChart(f) {
  // The line stretches with the card (SVG without aspect ratio); dots and labels are HTML so they stay round and readable.
  const W = 1000, H = 100;
  const n = f.pts.length;
  const vals = [f.start, ...f.pts.map((p) => p.v)];
  const lo = Math.min(0, ...vals), hi = Math.max(...vals) * 1.04 || 1;
  const xp = (i) => ((i + 0.5) / n) * 100; // percent
  const yp = (v) => (1 - (v - lo) / (hi - lo || 1)) * 100;
  const line = [[0, yp(f.start)], ...f.pts.map((p) => [xp(p.i), yp(p.v)])];
  const path = line.map(([px, py], i) => `${i ? "L" : "M"}${(px * W / 100).toFixed(1)} ${py.toFixed(2)}`).join(" ");
  const area = `${path} L${(xp(n - 1) * W / 100).toFixed(1)} ${H} L0 ${H} Z`;
  const zero = lo < 0 ? `<line class="fc-zero" x1="0" x2="${W}" y1="${yp(0).toFixed(2)}" y2="${yp(0).toFixed(2)}" vector-effect="non-scaling-stroke"/>` : "";
  const pos = (i, v) => `left:${xp(i).toFixed(2)}%;top:${yp(v).toFixed(2)}%`;
  const marks = f.events.map((e) => {
    const p = f.pts[e.i];
    const tip = e.items.map((o) => `${o.name} ${money(o.amount)}`).join(", ");
    return `<span class="fc-ev" style="${pos(e.i, p.v)}" title="${esc(`${fmtDay(e.d)}: ${tip}`)}"><em>${esc(e.items.map((o) => o.emoji || "•").slice(0, 2).join(""))}</em></span>`;
  }).join("");
  const low = f.low.v < f.start && !f.events.some((e) => e.i === f.low.i) ? `<span class="fc-low" style="${pos(f.low.i, f.low.v)}"></span>` : "";
  const pay = `<span class="fc-pay" style="left:${xp(n - 1).toFixed(2)}%"><b>${f.pay ? `Payday +${esc(moneyRound(f.pay))}` : S.account.irregular ? "Stretch ends" : "Payday"}</b></span>`;
  const ticks = [...new Set([0, Math.floor((n - 1) / 2), n - 1])].map((i) => `<span style="left:${xp(i).toFixed(2)}%">${i === 0 ? "Today" : esc(fmtDay(f.pts[i].d))}</span>`).join("");
  return `<div class="fc-plot" role="img" aria-label="Your balance until payday: lowest ${esc(money(f.low.v))} on ${esc(fmtDay(f.low.d))}">
    <svg class="fc-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="fcFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".24"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#fcFill)"/>${zero}<path class="fc-line" d="${path}" vector-effect="non-scaling-stroke"/>
    </svg>${pay}${marks}${low}
  </div>
  <div class="fc-x" aria-hidden="true">${ticks}</div>`;
}
function forecastCard(a) {
  const f = paydayForecast(a);
  if (!f) return "";
  const dip = f.low.v < 0;
  return `<div class="card fc-card focus-hide">
    <div class="card-head"><h2>${icon("chart", 20)} ${S.account.irregular ? "Until the stretch ends" : "Until payday"}</h2><span class="tiny">If you spend your daily guide</span></div>
    <div class="fc-stats">

}

/* ---------- Evening recap & closing streak ---------- */
function closedStreak() {
  let n = 0, d = todayISO();
  if (!S.dayClosed[d]) d = addDays(d, -1);
  while (S.dayClosed[d]) { n++; d = addDays(d, -1); }
  return n;
}
const todaysSpends = (today) => S.transactions.filter((t) => t.date === today && t.type === "expense" && !t.link);
function tomorrowGuide(a) {
  return a.days > 1 ? Math.floor((a.available * 100) / (a.days - 1)) / 100 : null;
}
function recapCard(a, force = false) {
  if (a.confirmPayday || a.checkedDays == null) return "";
  const closed = !!S.dayClosed[a.today];
  if (!force && !closed && new Date().getHours() < 17) return "";

  const delta = tg != null ? round2(tg - a.guide) : 0;

    ${closed ? `<p>${verdict} ${tomorrow}.</p>` : `

    <p class="tiny mt-s">${tomorrow}.</p>`}
    <div class="row wrap mt">

    </div>

function openForgot() {
  const today = todayISO();
  const days = Array.from({ length: 7 }, (_, i) => addDays(today, -i));
  const dayOpts = days.map((d, i) => [d, i === 0 ? "Today" : i === 1 ? "Yesterday" : `${DOW[fromISO(d).getDay()]} ${fmtDay(d)}`]);
  const row = (i, date) => `<div class="fg-row">${sel(`d${i}`, dayOpts, date, 'aria-label="Day"')}${moneyInp(`a${i}`, "", `aria-label="Amount"${i === 0 ? " autofocus" : ""}`)}${inp(`n${i}`, "", 'placeholder="What was it?" maxlength="80" aria-label="What was it?"')}${sel(`c${i}`, catOptions(true), "", 'aria-label="Category"')}</div>`;
  let count = 4;
  const checked = S.account.checkedOn;
  const hint = BAL && checked && days.some((d) => d < checked) ? `<p class="tiny mt">Spends dated before your last balance check (${esc(fmtDay(checked))}) are saved for your history only — they're already in that balance, so today's number stays the same.</p>` : "";
  const form = openModal({
    title: "I forgot to log…",
    wide: true,
    body: `<p class="muted">Add a few spends at once. Empty rows are skipped.</p>
      <div class="fg-head tiny" aria-hidden="true"><span>Day</span><span>Amount</span><span>What</span><span>Category</span></div>
      <div class="fg-rows">${Array.from({ length: count }, (_, i) => row(i, addDays(today, -1))).join("")}</div>
      <button type="button" class="btn sm mt" data-more>${icon("plus")}Another row</button>${hint}`,
    foot: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Add spends</button>`,
    onSubmit: (d) => {
      const rows = [];
      for (let i = 0; i < count; i++) {
        const amount = num(d[`a${i}`]);
        if (amount > 0) rows.push({ amount, name: (d[`n${i}`] || "").trim(), date: d[`d${i}`] || today, catId: d[`c${i}`] || "" });
      }
      if (!rows.length) { toast("Enter at least one amount"); return false; }
      const undo = snapshot();
      for (const r of rows) {
        const catId = r.catId || guessCategory(r.name);
        const rec = { type: "expense", amount: r.amount, date: r.date, catId, name: r.name || catById(catId)?.name || "Spend", note: "Added later" };
        if (BAL && checked && r.date < checked) rec.absorbed = true;
        addTx(rec);
      }
      commit(`${plural(rows.length, "spend")} added`, undo);
    },
  });
  form.querySelector("[data-more]").addEventListener("click", () => {
    const box = form.querySelector(".fg-rows");
    box.insertAdjacentHTML("beforeend", row(count, box.lastElementChild?.querySelector("select")?.value || addDays(today, -1)));
    box.lastElementChild.querySelector("input").focus();
    count++;
  });
}
