<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Inter:wght@400..700&display=swap">
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #12070c; font-family: Inter, sans-serif; }
  .abs { position: absolute; will-change: transform, opacity; }
  #bg { inset: 0; background: radial-gradient(900px 700px at 50% 45%, #3a1424 0%, #1c0a12 55%, #0d0509 100%); }
  #glow { width: 900px; height: 900px; left: 90px; top: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,143,171,.38), rgba(241,211,181,.12) 40%, rgba(0,0,0,0) 70%); }
  .frame { inset: 26px; border: 1px solid rgba(241, 211, 181, .28); border-radius: 26px; }
  #title { left: 0; right: 0; top: 360px; text-align: center; transform-origin: 50% 0; }
  .t { font-family: Fraunces, serif; font-weight: 600; letter-spacing: -.03em; line-height: .98; color: #fbeee6; font-size: 128px; }
  .t em { font-style: italic; font-weight: 500; background: linear-gradient(90deg, #f1d3b5, #ff9fb6 60%, #f1d3b5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { font-size: 22px; letter-spacing: .42em; text-transform: uppercase; color: #f1d3b5; opacity: .85; margin-bottom: 26px; }
  #lap { left: 130px; top: 330px; width: 820px; transform-origin: 50% 100%; }
  .screen { background: #000; border-radius: 26px 26px 0 0; padding: 18px 18px 22px; box-shadow: 0 60px 120px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08); position: relative; overflow: hidden; }
  .screen img { display: block; width: 100%; border-radius: 8px; }
  .base { height: 30px; margin: 0 -60px; background: linear-gradient(#5a4a50, #2a1f23); border-radius: 0 0 30px 30px; }
  #sweep { top: 0; bottom: 0; width: 220px; left: -300px; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0)); }
  #card { left: 70px; top: 650px; width: 380px; padding: 26px 30px; border-radius: 26px; background: rgba(24, 9, 16, .9); border: 1px solid rgba(241,211,181,.45); backdrop-filter: blur(14px); color: #fbeee6; box-shadow: 0 40px 80px -30px rgba(0,0,0,.7); }
  #card .k { font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: #f1d3b5; }
  #card .v { font-family: Fraunces, serif; font-size: 78px; font-weight: 600; letter-spacing: -.02em; line-height: 1; margin-top: 8px; }
  #card .v small { font-size: .45em; opacity: .7; }
  #card .s { font-size: 18px; opacity: .75; margin-top: 6px; }
  #phone { left: 700px; top: 400px; width: 290px; background: #000; border-radius: 52px; padding: 14px; box-shadow: 0 50px 100px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.1); }
  #phone::before { content: ""; display: block; height: 40px; background: #fbf4f6; border-radius: 40px 40px 0 0; }
  #phone img { display: block; width: 100%; border-radius: 0 0 40px 40px; }
  #end { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fbeee6; }
  #end .w { font-family: Fraunces, serif; font-size: 112px; font-weight: 650; letter-spacing: -.03em; }
  #end .w em { font-style: italic; font-weight: 500; color: #ff9fb6; }
  #end .l { width: 120px; height: 1px; background: #f1d3b5; margin: 26px auto; opacity: .7; }
  #end .tag { font-size: 30px; color: #f1d3b5; }
  #end .chips { display: flex; gap: 14px; margin-top: 34px; }
  #end .chips span { border: 1px solid rgba(241,211,181,.45); border-radius: 999px; padding: 12px 22px; font-size: 21px; }
  #end .shop { margin-top: 40px; font-size: 20px; letter-spacing: .18em; opacity: .7; text-transform: uppercase; }
</style></head><body>
<div id="bg" class="abs"></div>
<div id="glow" class="abs"></div>
<div id="title" class="abs"><div class="eyebrow">Lumi Budget</div><div class="t" id="l1">Your money,</div><div class="t" id="l2"><em>finally quiet.</em></div></div>
<div id="lap" class="abs"><div class="screen"><img src="../build/shots/home.png"><div id="sweep" class="abs"></div></div><div class="base"></div></div>
<div id="card" class="abs"><div class="k">Safe to spend today</div><div class="v">$41<small>.68</small></div><div class="s">≈ $47 a day · 17 days left</div></div>
<div id="phone" class="abs"><img src="../build/shots/m-today.png"></div>
<div id="end" class="abs"><div class="w">lumi <em>budget</em></div><div class="l"></div><div class="tag">The calm, ADHD-friendly budget planner</div>
  <div class="chips"><span>Online + offline</span><span>No subscription</span><span>Free demo</span></div><div class="shop">tidyplannercoart.etsy.com</div></div>
<div class="frame abs"></div>
<script src="common.js"></script>
<script>
window.DURATION = 12;
window.render = (t) => {
  const endK = p(t, 9.7, 10.6);
  set($("glow"), { o: lerp(.5, 1, p(t, 0, 2)) * (1 - .4 * endK), x: Math.sin(t * .5) * 40, y: Math.cos(t * .4) * 30, s: lerp(.8, 1.1, p(t, 0, 12, (x) => x)) });
  // Title: letters rise in, then lift away as the laptop arrives
  const up = p(t, 2.2, 3.3);
  set($("title"), { o: 1 - p(t, 2.6, 3.3), y: lerp(0, -210, up), s: lerp(1, .7, up) });
  set($("l1"), { o: p(t, .3, 1.3), y: lerp(40, 0, p(t, .3, 1.3)), blur: lerp(10, 0, p(t, .3, 1.3)) });
  set($("l2"), { o: p(t, .9, 1.9), y: lerp(40, 0, p(t, .9, 1.9)), blur: lerp(10, 0, p(t, .9, 1.9)) });
  // Laptop rises with a gentle 3D tilt, then a slow push-in
  const lin = p(t, 2.5, 4.0);
  const lapShift = p(t, 6.8, 7.9);
  set($("lap"), { o: lin * (1 - endK), y: lerp(520, 0, lin), rx: lerp(28, lerp(6, 0, p(t, 4, 9)), lin), s: lerp(1, 1.08, p(t, 4, 9.7, (x) => x)), x: lerp(0, -110, lapShift), blur: 6 * endK });
  $("sweep").style.transform = `translateX(${lerp(0, 1400, p(t, 5.4, 6.6))}px) skewX(-12deg)`;
  // Floating "safe to spend" card
  const cin = p(t, 5.0, 5.9, easeOut);
  set($("card"), { o: cin * (1 - p(t, 9.4, 10)), y: lerp(40, 0, cin) + Math.sin(t * 1.4) * 5, s: lerp(.92, 1, cin), blur: lerp(8, 0, cin) });
  // Phone glides in from the right
  const pin = p(t, 6.8, 7.9, easeOut);
  set($("phone"), { o: pin * (1 - endK), x: lerp(420, 0, pin), r: lerp(8, -3, pin), y: Math.sin(t * 1.1) * 6 });
  // End card
  const ein = p(t, 10.0, 10.9, easeOut);
  set($("end"), { o: ein, y: lerp(30, 0, ein), blur: lerp(8, 0, ein) });
};
</script></body></html>
